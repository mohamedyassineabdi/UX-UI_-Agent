<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UX/UI Auditor</title>
    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.6.3/dist/es-module-shims.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@v0.151.3/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/"
        }
      }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/gsap@3.11.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.11.5/dist/ScrollTrigger.min.js"></script>
    <script src="./config.js"></script>
    <style>
      :root {
        --bg: #232332;
        --bg-2: #2b2c3c;
        --panel: rgba(37, 37, 51, 0.88);
        --panel-strong: rgba(48, 49, 66, 0.94);
        --panel-soft: rgba(255, 255, 255, 0.045);
        --line: rgba(168, 160, 209, 0.18);
        --line-strong: rgba(206, 123, 255, 0.34);
        --text: #f7f4ff;
        --muted: #beb7d5;
        --faint: #8d88a7;
        --purple: #9b63ff;
        --violet: #6374ff;
        --pink: #f15bb5;
        --magenta: #da52ff;
        --orange: #ff8a5b;
        --red: #ff5c7a;
        --yellow: #ffe100;
        --lime: #b4ff00;
        --green: #37d67a;
        --teal: #71ddff;
        --blue: #4f66ff;
        --danger: #ff6a7d;
        --success: #2db757;
        --shadow: 0 34px 96px rgba(7, 8, 18, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Aptos, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: -0.01em;
        margin: 0;
        min-height: 100vh;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      input[type="file"] {
        cursor: pointer;
      }

      .app-shell {
        background:
          radial-gradient(circle at 12% 8%, rgba(82, 101, 255, 0.18), transparent 20rem),
          radial-gradient(circle at 84% 8%, rgba(217, 86, 164, 0.2), transparent 20rem),
          radial-gradient(circle at 94% 16%, rgba(134, 88, 255, 0.22), transparent 16rem),
          linear-gradient(180deg, #1f2030 0%, #232332 44%, #272738 100%);
        isolation: isolate;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }

      .app-shell::before {
        background:
          linear-gradient(110deg, rgba(0, 0, 0, 0) 0%, rgba(86, 103, 255, 0.18) 18%, rgba(168, 99, 255, 0.24) 46%, rgba(242, 96, 168, 0.2) 74%, rgba(255, 224, 0, 0.15) 100%);
        content: "";
        filter: blur(68px);
        height: 260px;
        left: 16%;
        opacity: 0.78;
        pointer-events: none;
        position: absolute;
        right: -8%;
        top: -112px;
        transform: rotate(5deg);
        z-index: -1;
      }

      .app-shell::after {
        background:
          radial-gradient(circle at center, rgba(158, 98, 255, 0.16), transparent 56%),
          repeating-radial-gradient(circle at center, rgba(214, 94, 164, 0.12) 0, rgba(214, 94, 164, 0.12) 2px, transparent 2px, transparent 18px);
        border-radius: 999px;
        content: "";
        height: 340px;
        opacity: 0.2;
        pointer-events: none;
        position: absolute;
        right: -110px;
        top: -44px;
        width: 340px;
        z-index: -1;
      }

      .topbar {
        align-items: center;
        backdrop-filter: blur(22px);
        background: rgba(29, 30, 43, 0.82);
        border-bottom: 1px solid rgba(167, 157, 214, 0.14);
        display: flex;
        justify-content: space-between;
        min-height: 82px;
        padding: 0 clamp(24px, 7vw, 132px);
        position: sticky;
        top: 0;
        transform: translateY(0);
        transition: opacity 0.18s ease, transform 0.18s ease;
        z-index: 30;
      }

      .view-home .topbar {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        left: 50%;
        margin: 18px auto 0;
        max-width: min(736px, calc(100% - 36px));
        min-height: 60px;
        padding: 0 10px 0 18px;
        position: fixed;
        transform: translateX(-50%);
        width: 100%;
      }

      .topbar.is-fading {
        pointer-events: none;
      }

      .view-home .brand-logo {
        width: 128px;
      }

      .home-nav {
        align-items: center;
        display: none;
        gap: 24px;
        margin-left: auto;
      }

      .view-home .home-nav {
        display: flex;
      }

      .home-nav a {
        color: rgba(247, 244, 255, 0.54);
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
      }

      .home-nav button {
        background: #f7f7f8;
        border: 0;
        border-radius: 10px;
        color: #101018;
        cursor: pointer;
        font-weight: 850;
        min-height: 38px;
        padding: 0 22px;
      }

      .brand {
        align-items: center;
        display: flex;
        min-width: 0;
      }

      .brand-logo {
        display: block;
        height: auto;
        width: clamp(142px, 11vw, 184px);
      }

      .topbar-meta {
        align-items: center;
        color: #d9d2ee;
        display: inline-flex;
        font-size: 0.9rem;
        font-weight: 700;
        gap: 10px;
        letter-spacing: 0.02em;
      }

      .topbar-mark {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(214, 201, 255, 0.82));
        border-radius: 999px 999px 999px 220px;
        display: inline-block;
        height: 18px;
        position: relative;
        width: 28px;
      }

      .topbar-mark::after {
        background: rgba(29, 30, 43, 0.9);
        border-radius: 999px;
        content: "";
        height: 10px;
        left: 9px;
        position: absolute;
        top: 4px;
        width: 10px;
      }

      .page {
        margin: 0 auto;
        max-width: 1440px;
        padding: 0 clamp(22px, 7vw, 96px) 96px;
      }

      .view-home .page {
        max-width: none;
        padding: 0;
      }

      .page {
        overflow-x: hidden;
      }

      .hero {
        align-items: center;
        display: grid;
        justify-items: center;
        isolation: isolate;
        min-height: 100vh;
        padding: 132px 24px 92px;
        position: relative;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.045), transparent 28rem),
          radial-gradient(circle at 50% 100%, rgba(96, 70, 138, 0.18), transparent 34rem),
          #0e0b13;
        overflow: hidden;
      }

      .hero::before {
        animation: heroAurora 30s ease-in-out infinite alternate;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.04), transparent 16rem),
          radial-gradient(circle at 74% 18%, rgba(156, 128, 220, 0.08), transparent 18rem),
          radial-gradient(circle at 62% 84%, rgba(255, 255, 255, 0.045), transparent 26rem);
        content: "";
        filter: blur(34px);
        height: 80%;
        left: -6%;
        opacity: 0.88;
        pointer-events: none;
        position: absolute;
        right: -6%;
        top: -10%;
        z-index: 0;
      }

      .hero::after {
        background:
          radial-gradient(circle at center, rgba(14, 11, 19, 0) 0%, rgba(14, 11, 19, 0.04) 42%, rgba(14, 11, 19, 0.72) 100%);
        content: "";
        inset: 0;
        opacity: 1;
        pointer-events: none;
        position: absolute;
        z-index: 0;
      }

      .hero > * {
        position: relative;
        z-index: 1;
      }

      .hero-content {
        align-items: center;
        display: grid;
        justify-items: center;
        max-width: 860px;
        text-align: center;
      }

      .hero > .hero-particles {
        z-index: 0;
      }

      .hero-particles {
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        position: absolute;
      }

      .hero-particles-canvas {
        display: block;
        height: 100%;
        opacity: 0.92;
        width: 100%;
      }

      .ey-pill {
        align-items: center;
        background: rgba(157, 111, 255, 0.08);
        border: 1px solid rgba(171, 141, 255, 0.18);
        border-radius: 999px;
        color: #d7c5ff;
        display: inline-flex;
        font-size: 0.72rem;
        font-weight: 800;
        gap: 9px;
        letter-spacing: 0.18em;
        line-height: 1;
        padding: 10px 16px;
        text-transform: uppercase;
        width: fit-content;
      }

      .hero h1,
      .launch-copy h2 {
        color: var(--text);
        font-size: clamp(3rem, 6vw, 5rem);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.08;
        margin: 30px 0 34px;
        max-width: 860px;
      }

      .accent {
        background: linear-gradient(90deg, #79a0ff 0%, #b96aff 45%, #ff72b6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-block;
      }

      .hero-copy,
      .launch-copy p {
        color: #c9c2db;
        font-size: clamp(1rem, 1.12vw, 1.08rem);
        line-height: 1.7;
        margin: 0;
        max-width: 460px;
      }

      .hero-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin-top: 12px;
      }

      .hero-actions .hero-liquid-button {
        backdrop-filter: blur(18px) saturate(145%);
        -webkit-backdrop-filter: blur(18px) saturate(145%);
        border-radius: 12px;
        box-shadow:
          0 16px 34px rgba(0, 0, 0, 0.26),
          inset 1px 1px 0 rgba(255, 255, 255, 0.12);
        min-height: 50px;
        min-width: 136px;
        overflow: hidden;
        padding: 0 26px;
        position: relative;
      }

      .hero-actions .hero-liquid-button::before {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
        border-radius: inherit;
        content: "";
        inset: 1px;
        opacity: 0.7;
        pointer-events: none;
        position: absolute;
      }

      .hero-actions .hero-liquid-button::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34), transparent);
        content: "";
        height: 180%;
        left: -36%;
        opacity: 0.66;
        pointer-events: none;
        position: absolute;
        top: -38%;
        transform: rotate(18deg);
        transition: transform 0.38s ease, opacity 0.38s ease;
        width: 40%;
      }

      .hero-actions .hero-liquid-button > * {
        position: relative;
        z-index: 1;
      }

      .hero-actions .hero-liquid-button .icon {
        margin-left: 2px;
      }

      .hero-actions .hero-liquid-button:hover {
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.32),
          inset 1px 1px 0 rgba(255, 255, 255, 0.16);
        transform: translateY(-1px);
      }

      .hero-actions .hero-liquid-button:hover::after {
        opacity: 0.8;
        transform: translateX(24px) rotate(18deg);
      }

      .hero-actions .hero-liquid-button.primary {
        background: #f7f7f8;
        border: 1px solid rgba(255, 255, 255, 0.9);
        color: #111018;
      }

      .hero-actions .hero-liquid-button.secondary {
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(247, 244, 255, 0.62);
      }

      .hero-signature {
        align-items: center;
        color: #f0ebff;
        display: inline-flex;
        font-size: 0.98rem;
        font-weight: 500;
        gap: 10px;
        margin-top: 24px;
        opacity: 0.9;
      }

      .hero-release {
        align-items: center;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        color: rgba(247, 244, 255, 0.52);
        display: inline-flex;
        font-size: 0.9rem;
        font-weight: 750;
        gap: 12px;
        padding: 6px 16px 6px 7px;
      }

      .hero-release strong {
        background: #f7f7f8;
        border-radius: 999px;
        color: #111018;
        font-size: 0.8rem;
        padding: 7px 12px;
      }

      .hero-signature-mark {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(214, 201, 255, 0.82));
        border-radius: 999px 999px 999px 220px;
        display: inline-block;
        height: 18px;
        position: relative;
        width: 28px;
      }

      .hero-signature-mark::after {
        background: rgba(29, 30, 43, 0.88);
        border-radius: 999px;
        content: "";
        height: 10px;
        left: 9px;
        position: absolute;
        top: 4px;
        width: 10px;
      }

      .primary,
      .secondary,
      .ghost {
        align-items: center;
        border-radius: 999px;
        cursor: pointer;
        display: inline-flex;
        font-weight: 850;
        gap: 10px;
        justify-content: center;
        min-height: 58px;
        padding: 0 28px;
        text-decoration: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease, background 0.18s ease, color 0.18s ease;
      }

      .primary {
        background: linear-gradient(180deg, #ffe828 0%, #ffe100 100%);
        border: 1px solid rgba(255, 234, 117, 0.74);
        box-shadow: 0 16px 36px rgba(255, 225, 0, 0.2);
        color: #252535;
      }

      .primary:hover,
      .secondary:hover,
      .ghost:hover {
        transform: translateY(-1px);
      }

      .primary:disabled {
        cursor: not-allowed;
        opacity: 0.45;
        transform: none;
      }

      .secondary,
      .ghost {
        background: rgba(52, 53, 71, 0.62);
        border: 1px solid rgba(161, 154, 198, 0.16);
        color: white;
      }

      .compact {
        min-height: 46px;
        padding: 0 18px;
        white-space: nowrap;
      }

      .ghost {
        border-color: rgba(161, 154, 198, 0.14);
        min-height: 46px;
        padding: 0 18px;
      }

      .stop-button {
        border-color: rgba(255, 107, 107, 0.52);
        color: #ffd0d0;
      }

      .stop-button:hover {
        background: rgba(255, 107, 107, 0.12);
        border-color: rgba(255, 107, 107, 0.78);
      }

      .icon {
        display: inline-block;
        flex: 0 0 auto;
        height: 19px;
        width: 19px;
      }

      .hero-visual {
        min-height: 560px;
        position: relative;
      }

      .visual-card {
        background:
          radial-gradient(circle at 28% 72%, rgba(84, 104, 255, 0.16), transparent 18rem),
          radial-gradient(circle at 80% 20%, rgba(232, 103, 174, 0.14), transparent 18rem),
          linear-gradient(135deg, rgba(15, 19, 46, 0.66), rgba(29, 18, 43, 0.3) 58%, rgba(45, 18, 37, 0.22));
        border: 1px solid rgba(156, 149, 197, 0.08);
        border-radius: 34px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 28px 72px rgba(6, 8, 18, 0.3);
        height: min(66vh, 560px);
        min-height: 500px;
        overflow: hidden;
        position: absolute;
        right: 0;
        top: 0;
        width: min(100%, 620px);
      }

      .visual-card::before {
        background:
          radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.09), transparent 58%);
        content: "";
        inset: 0;
        opacity: 0.82;
        position: absolute;
      }

      .chaingpt-robot-card {
        isolation: isolate;
      }

      .chaingpt-robot-card .webgl {
        inset: 0;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        visibility: hidden;
        z-index: 1;
      }

      .chaingpt-robot-card .webgl canvas {
        display: none;
      }

      .robot-video-assets,
      .shader-assets {
        display: none;
      }

      .webgl-fallback {
        display: none;
      }

      body.loaded .webgl-fallback {
        opacity: 0;
        visibility: hidden;
      }

      .motif-stage {
        align-items: center;
        display: flex;
        justify-content: center;
      }

      .motif-stage::before {
        animation: stageGlowShift 14s ease-in-out infinite alternate;
        background:
          radial-gradient(circle at 28% 58%, rgba(86, 107, 255, 0.18), transparent 24%),
          radial-gradient(circle at 72% 28%, rgba(243, 110, 191, 0.16), transparent 22%);
        content: "";
        filter: blur(28px);
        inset: 10% 12%;
        pointer-events: none;
        position: absolute;
        z-index: 1;
      }

      .motif-stage::after {
        animation: motifHalo 12s ease-in-out infinite alternate;
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 58%),
          radial-gradient(circle, rgba(126, 114, 255, 0.08), transparent 72%);
        content: "";
        height: 460px;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 460px;
        z-index: 0;
      }

      .motif-stage-inner {
        align-items: center;
        display: grid;
        gap: 0;
        justify-items: center;
        padding: 42px 34px;
        position: relative;
        width: 100%;
        z-index: 2;
      }

      .motif-stage-inner::after {
        display: none;
      }

      .motif-emblem {
        aspect-ratio: 1;
        display: block;
        filter: drop-shadow(0 42px 82px rgba(123, 112, 255, 0.28));
        transform-origin: center;
        animation: motifFloat 11s cubic-bezier(0.37, 0, 0.2, 1) infinite;
        width: min(78%, 460px);
      }

      .motif-emblem path {
        animation: motifStrokePulse 8s ease-in-out infinite;
      }

      .motif-caption {
        display: none;
      }

      .motif-orbit {
        display: none;
      }

      .motif-orbit::before,
      .motif-orbit::after {
        border: 1px solid rgba(224, 120, 171, 0.12);
        border-radius: inherit;
        content: "";
        inset: 18px;
        position: absolute;
      }

      .motif-orbit::after {
        inset: 36px;
      }

      .motif-star {
        display: none;
      }

      .motif-star::before,
      .motif-star::after {
        border: 1px solid rgba(152, 128, 255, 0.18);
        border-radius: 120px;
        content: "";
        inset: 0;
        position: absolute;
      }

      .motif-star::before {
        transform: rotate(45deg);
      }

      .motif-star::after {
        inset: 16px;
      }

      .robot-script-hooks {
        height: 1px;
        left: -9999px;
        overflow: hidden;
        position: fixed;
        top: -9999px;
        width: 1px;
      }

      .robot-portrait {
        bottom: -44px;
        height: 500px;
        left: 46%;
        position: absolute;
        transform: translateX(-50%);
        width: 360px;
        z-index: 2;
      }

      .robot-head {
        background:
          radial-gradient(circle at 27% 20%, #fffbd1 0 13%, transparent 14%),
          radial-gradient(circle at 70% 34%, rgba(244, 63, 157, 0.95), transparent 21%),
          linear-gradient(135deg, #fff4a8 0%, #ff5a14 27%, #101016 45%, #1162ff 70%, #dfe8ff 100%);
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 44% 48% 48% 44%;
        box-shadow:
          inset -18px -26px 38px rgba(0, 0, 0, 0.5),
          inset 18px 16px 34px rgba(255, 255, 255, 0.28),
          0 25px 90px rgba(17, 98, 255, 0.28);
        height: 176px;
        left: 92px;
        position: absolute;
        top: 12px;
        transform: rotate(4deg);
        width: 162px;
      }

      .robot-head::before {
        background: linear-gradient(90deg, #0b0a0f 0%, #15131f 55%, #050506 100%);
        border-radius: 999px;
        content: "";
        height: 48px;
        left: 28px;
        position: absolute;
        top: 56px;
        transform: rotate(-2deg);
        width: 122px;
      }

      .robot-head::after {
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.02));
        border-radius: 50%;
        content: "";
        height: 86px;
        left: 18px;
        position: absolute;
        top: 13px;
        width: 78px;
      }

      .robot-neck {
        background: linear-gradient(90deg, #11131f, #f2f4ff 42%, #ff5a14 60%, #09090e);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 22px;
        height: 80px;
        left: 142px;
        position: absolute;
        top: 156px;
        width: 66px;
      }

      .robot-torso {
        background:
          radial-gradient(circle at 36% 14%, rgba(255, 230, 0, 0.9), transparent 20%),
          radial-gradient(circle at 76% 34%, rgba(244, 63, 157, 0.78), transparent 22%),
          linear-gradient(135deg, #dfe8ff 0%, #17234d 34%, #050506 54%, #ff5a14 75%, #f8f7ff 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 48% 48% 18% 18%;
        box-shadow:
          inset -28px -30px 52px rgba(0, 0, 0, 0.54),
          inset 20px 20px 42px rgba(255, 255, 255, 0.16),
          0 34px 90px rgba(0, 0, 0, 0.52);
        height: 270px;
        left: 78px;
        position: absolute;
        top: 206px;
        width: 214px;
      }

      .robot-shoulder {
        background: linear-gradient(135deg, #dfe8ff, #0e1020 48%, #ff5a14 100%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        height: 80px;
        position: absolute;
        top: 222px;
        width: 92px;
      }

      .robot-shoulder.left {
        left: 20px;
        transform: rotate(-22deg);
      }

      .robot-shoulder.right {
        right: 4px;
        transform: rotate(18deg);
      }

      .robot-arm {
        background: linear-gradient(180deg, #1162ff, #0d1022 54%, #cbd5ff);
        border-radius: 999px;
        height: 190px;
        left: 28px;
        position: absolute;
        top: 292px;
        transform: rotate(22deg);
        width: 42px;
      }

      .launch-section {
        align-items: start;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.045), transparent 28rem),
          radial-gradient(circle at 50% 100%, rgba(96, 70, 138, 0.18), transparent 34rem),

        display: grid;

        grid-template-columns: minmax(280px, 0.62fr) minmax(0, 1fr);

        padding: 42px clamp(22px, 7vw, 96px) 104px;
        position: relative;

      .launch-section:last-child {
        padding-bottom: 140px;

        padding-top: 18px;

      .launch-copy h2 {
        font-size: clamp(2.4rem, 4.1vw, 4rem);
        margin: 0 0 18px;
      }

      .process-list {
        display: grid;
        gap: 18px;
        margin-top: 34px;
      }

      .process-step {
        align-items: start;
        display: grid;
        background: rgba(52, 53, 71, 0.42);
        border: 1px solid rgba(161, 154, 198, 0.12);
        border-radius: 24px;
        gap: 15px;
        grid-template-columns: 34px 1fr;
        padding: 18px;
      }

      .process-step-number {
        align-items: center;
        background: linear-gradient(135deg, #6e75ff, #ba68ff 58%, #f06abf 100%);
        border-radius: 999px;
        display: flex;
        color: #ffffff;
        font-size: 0.86rem;
        font-weight: 900;
        height: 34px;
        justify-content: center;
        width: 34px;
      }

      .process-step strong {
        display: block;
        font-size: 1.02rem;
        margin-top: 2px;
      }

      .process-step p {
        color: var(--muted);
        line-height: 1.5;
        margin: 8px 0 0;
      }

      .audit-panel {
        backdrop-filter: blur(24px);
        background:
          radial-gradient(circle at 12% 100%, rgba(84, 104, 255, 0.12), transparent 18rem),
          radial-gradient(circle at 100% 0%, rgba(238, 102, 172, 0.12), transparent 18rem),
          rgba(37, 37, 51, 0.94);
        border: 1px solid rgba(161, 154, 198, 0.14);
        border-radius: 34px;
        box-shadow: var(--shadow);
        padding: clamp(26px, 3vw, 38px);
      }

      .audit-panel h2 {
        font-size: 1.8rem;
        margin: 0 0 12px;
      }

      .panel-subtitle {
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 34px;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-top: 24px;
      }

      .field label,
      .field-legend {
        color: #f6f2ff;
        font-size: 0.94rem;
        font-weight: 850;
      }

      .field input,
      .field select {
        background: rgba(51, 52, 70, 0.72);
        border: 1px solid rgba(161, 154, 198, 0.14);
        border-radius: 20px;
        color: var(--text);
        min-height: 58px;
        outline: 0;
        padding: 0 26px;
        width: 100%;
      }

      .field select {
        appearance: none;
      }

      .field input::placeholder {
        color: rgba(196, 190, 220, 0.42);
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(174, 123, 255, 0.88);
        box-shadow: 0 0 0 4px rgba(174, 123, 255, 0.12);
      }

      .field-note {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
        margin-top: 10px;
      }

      .warning-note {
        color: #ffd7a3;
      }

      .mobile-discovery-panel {
        align-items: center;
        background: rgba(52, 53, 71, 0.52);
        border: 1px solid rgba(161, 154, 198, 0.16);
        border-radius: 22px;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-top: 20px;
        padding: 16px;
      }

      .mobile-discovery-panel strong,
      .mobile-discovery-panel span {
        display: block;
      }

      .mobile-discovery-panel strong {
        color: var(--text);
      }

      .mobile-discovery-panel span {
        color: var(--muted);
        font-size: 0.92rem;
        margin-top: 4px;
      }

      .field-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .choice-stack {
        display: grid;
        gap: 14px;
        margin-top: 8px;
      }

      .choice {
        align-items: center;
        background: rgba(52, 53, 71, 0.52);
        border: 1px solid rgba(161, 154, 198, 0.14);
        border-radius: 24px;
        cursor: pointer;
        display: grid;
        gap: 16px;
        grid-template-columns: 50px 1fr;
        min-height: 100px;
        padding: 18px 24px;
        text-align: left;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, transform 0.18s ease;
        width: 100%;
      }

      .choice:hover {
        border-color: rgba(174, 123, 255, 0.34);
        transform: translateY(-1px);
      }

      .choice.active {
        background:
          linear-gradient(135deg, rgba(92, 111, 255, 0.1), rgba(242, 103, 183, 0.08)),
          rgba(56, 57, 76, 0.78);
        border-color: rgba(184, 117, 255, 0.62);
        box-shadow: 0 0 0 1px rgba(184, 117, 255, 0.14), 0 18px 48px rgba(121, 109, 255, 0.12);
      }

      .choice-icon {
        align-items: center;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        display: flex;
        height: 48px;
        justify-content: center;
        width: 48px;
      }

      .choice.active .choice-icon {
        background: linear-gradient(135deg, #6070ff, #af69ff 58%, #f26bc0 100%);
        color: #ffffff;
      }

      .choice strong {
        display: block;
        font-size: 1.06rem;
        margin-bottom: 7px;
      }

      .choice small {
        color: #d7d7df;
        display: block;
        font-size: 0.91rem;
        font-weight: 700;
        line-height: 1.36;
      }

      .segmented {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
      }

      .segmented button {
        align-items: center;
        background: rgba(51, 52, 70, 0.62);
        border: 1px solid rgba(161, 154, 198, 0.14);
        border-radius: 999px;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        font-weight: 850;
        gap: 8px;
        justify-content: center;
        min-height: 58px;
      }

      .segmented button.active {
        background: linear-gradient(180deg, #ffe828 0%, #ffe100 100%);
        border-color: rgba(255, 234, 117, 0.72);
        color: #252535;
      }

      .upload-zone {
        background: rgba(51, 52, 70, 0.46);
        border: 1.5px dashed rgba(161, 154, 198, 0.28);
        border-radius: 22px;
        cursor: pointer;
        display: grid;
        gap: 8px;
        padding: 22px;
      }

      .upload-zone:hover,
      .upload-zone:focus-within {
        border-color: rgba(174, 123, 255, 0.82);
        box-shadow: 0 0 0 4px rgba(174, 123, 255, 0.12);
      }

      .upload-zone strong {
        color: white;
      }

      .upload-zone span {
        color: var(--muted);
        line-height: 1.45;
      }

      .upload-zone input {
        color: var(--muted);
        margin-top: 8px;
        max-width: 100%;
      }

      .screenshot-grid {
        display: flex;
        gap: 14px;
        margin-top: 16px;
        overflow-x: auto;
        padding: 2px 2px 12px;
      }

      .screenshot-card {
        background: rgba(51, 52, 70, 0.6);
        border: 1px solid rgba(161, 154, 198, 0.16);
        border-radius: 18px;
        flex: 0 0 170px;
        overflow: hidden;
        position: relative;
      }

      .screenshot-thumb {
        align-items: center;
        aspect-ratio: 1 / 1;
        background:
          linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
          rgba(0, 0, 0, 0.28);
        background-size: 18px 18px;
        display: flex;
        justify-content: center;
      }

      .screenshot-thumb img {
        height: 100%;
        object-fit: contain;
        width: 100%;
      }

      .screenshot-meta {
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .screenshot-name-row small {
        color: var(--muted);
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .remove-screenshot {
        align-items: center;
        background: rgba(5, 5, 10, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 999px;
        color: white;
        cursor: pointer;
        display: flex;
        font-size: 0.76rem;
        font-weight: 900;
        height: 28px;
        justify-content: center;
        padding: 0;
        position: absolute;
        right: 8px;
        top: 8px;
        width: 28px;
      }

      .screenshot-label-input {
        border-radius: 12px !important;
        font-size: 0.88rem !important;
        min-height: 42px !important;
        padding: 0 10px !important;
      }

      .start-button {
        margin-top: 30px;
        min-height: 58px;
        width: 100%;
      }

      .error {
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid rgba(255, 107, 107, 0.35);
        border-radius: 14px;
        color: #ffd0d0;
        line-height: 1.45;
        margin-top: 18px;
        padding: 14px 16px;
      }

      .status-strip {
        align-items: center;
        background: rgba(51, 52, 70, 0.62);
        border: 1px solid rgba(161, 154, 198, 0.16);
        border-radius: 22px;
        color: var(--muted);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 22px;
        padding: 14px 16px;
      }

      .status-strip strong {
        color: white;
      }

      .progress-wrap {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        height: 11px;
        overflow: hidden;
        width: 100%;
      }

      .progress {
        background: linear-gradient(90deg, #6070ff 0%, #b669ff 54%, #f06abf 100%);
        height: 100%;
        transition: width 0.35s ease;
      }

      .modal-backdrop {
        align-items: center;
        background:
          radial-gradient(circle at 50% 8%, rgba(255, 230, 0, 0.1), transparent 28rem),
          rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(18px);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 24px;
        position: fixed;
        z-index: 100;
      }

      .modal {
        background:
          radial-gradient(circle at 86% 0%, rgba(255, 230, 0, 0.12), transparent 12rem),
          radial-gradient(circle at 74% 8%, rgba(247, 125, 30, 0.14), transparent 16rem),
          radial-gradient(circle at 12% 18%, rgba(132, 0, 255, 0.16), transparent 18rem),
          rgba(26, 26, 36, 0.98);
        border: 1px solid rgba(196, 196, 208, 0.18);
        border-radius: 28px;
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        max-height: min(900px, 92vh);
        max-width: 1060px;
        overflow: auto;
        padding: clamp(26px, 4vw, 46px);
        position: relative;
        width: 100%;
      }

      .modal::before {
        background:
          linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.42), transparent);
        content: "";
        height: 1px;
        left: 30px;
        opacity: 0.7;
        position: absolute;
        right: 30px;
        top: 0;
      }

      .modal-head {
        align-items: start;
        display: flex;
        gap: 18px;
        justify-content: space-between;
      }

      .modal h2 {
        font-size: clamp(2.4rem, 5.2vw, 4.45rem);
        letter-spacing: 0;
        line-height: 1.05;
        margin: 24px 0 14px;
        max-width: 790px;
      }

      .stage {
        color: var(--muted);
        font-weight: 750;
        line-height: 1.5;
        margin: 0 0 26px;
        max-width: 720px;
      }

      .scan-layout {
        align-items: stretch;
        display: grid;
        gap: 22px;
        grid-template-columns: minmax(360px, 1fr) minmax(230px, 0.45fr);
        margin: 28px 0 26px;
      }

      .scan-frame {
        aspect-ratio: 16 / 9;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 50, 255, 0.1), transparent 32%),
          rgba(5, 5, 12, 0.72);
        border: 1px solid rgba(255, 230, 0, 0.22);
        border-radius: 22px;
        box-shadow: inset 0 0 60px rgba(255, 230, 0, 0.07);
        min-height: 320px;
        overflow: hidden;
        position: relative;
      }

      .scan-frame::before,
      .scan-frame::after {
        content: "";
        left: 12%;
        position: absolute;
        right: 12%;
      }

      .scan-frame::before {
        animation: scanLineMove 6.5s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.96), transparent);
        box-shadow: 0 0 24px rgba(255, 230, 0, 0.62);
        height: 3px;
        top: 0;
        z-index: 4;
      }

      .scan-frame::after {
        animation: scanSweep 2.6s ease-in-out infinite;
        background: linear-gradient(180deg, transparent, rgba(255, 50, 255, 0.26), transparent);
        height: 34%;
        top: -22%;
        z-index: 4;
      }

      .scan-corner {
        border-color: rgba(255, 255, 255, 0.95);
        border-style: solid;
        height: 84px;
        position: absolute;
        width: 84px;
        z-index: 3;
      }

      .scan-corner.tl {
        border-width: 10px 0 0 10px;
        border-radius: 26px 0 0 0;
        left: 32px;
        top: 32px;
      }

      .scan-corner.tr {
        border-width: 10px 10px 0 0;
        border-radius: 0 26px 0 0;
        right: 32px;
        top: 32px;
      }

      .scan-corner.bl {
        border-width: 0 0 10px 10px;
        border-radius: 0 0 0 26px;
        bottom: 32px;
        left: 32px;
      }

      .scan-corner.br {
        border-width: 0 10px 10px 0;
        border-radius: 0 0 26px 0;
        bottom: 32px;
        right: 32px;
      }

      .scan-core {
        background: rgba(7, 7, 13, 0.72);
        border: 1px solid rgba(255, 230, 0, 0.22);
        border-radius: 14px;
        left: 22px;
        max-width: min(360px, calc(100% - 44px));
        min-width: 0;
        padding: 12px 14px;
        position: absolute;
        text-align: left;
        top: 22px;
        transform: none;
        z-index: 6;
      }

      .scan-core strong {
        color: white;
        display: block;
        font-size: clamp(0.94rem, 1.35vw, 1.12rem);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scan-core span {
        color: var(--yellow);
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .scan-real-shot {
        background: rgba(255, 255, 255, 0.04);
        animation: realPageScroll 11s ease-in-out infinite;
        display: block;
        height: 100%;
        inset: 0;
        object-fit: cover;
        object-position: top center;
        position: absolute;
        width: 100%;
        z-index: 3;
      }

      .scan-frame.has-preview .scan-live-frame {
        opacity: 0;
      }

      .scan-live-frame {
        background: rgba(5, 5, 12, 0.92);
        border: 0;
        display: block;
        height: 100%;
        inset: 0;
        pointer-events: none;
        position: absolute;
        transition: opacity 0.25s ease;
        width: 100%;
        z-index: 2;
      }

      .scan-frame.has-live .scan-real-shot {
        opacity: 0.72;
      }

      .scan-empty-state {
        align-items: center;
        color: var(--muted);
        display: grid;
        font-weight: 850;
        gap: 10px;
        inset: 0;
        justify-items: center;
        padding: 28px;
        position: absolute;
        text-align: center;
        z-index: 1;
      }

      .scan-empty-state strong {
        color: white;
        font-size: 1.15rem;
      }

      .scan-browser {
        background: rgba(12, 12, 20, 0.82);
        border: 1px solid rgba(255, 230, 0, 0.18);
        border-radius: 16px;
        box-shadow: 0 22px 58px rgba(0, 0, 0, 0.32);
        bottom: 22px;
        left: 50%;
        min-width: min(640px, calc(100% - 84px));
        overflow: hidden;
        position: absolute;
        transform: translateX(-50%);
        z-index: 5;
      }

      .scan-browser-top {
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: grid;
        gap: 10px;
        grid-template-columns: auto 1fr;
        min-height: 42px;
        padding: 8px 12px;
      }

      .scan-browser-dots {
        display: flex;
        gap: 6px;
      }

      .scan-browser-dots span {
        border-radius: 999px;
        height: 9px;
        width: 9px;
      }

      .scan-browser-dots span:nth-child(1) {
        background: #ff5f57;
      }

      .scan-browser-dots span:nth-child(2) {
        background: #ffbd2e;
      }

      .scan-browser-dots span:nth-child(3) {
        background: #28c840;
      }

      .scan-browser-address {
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        color: #f1edf8;
        font-size: 0.78rem;
        font-weight: 800;
        overflow: hidden;
        padding: 7px 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scan-browser-body {
        display: none;
        gap: 10px;
        padding: 13px 14px 15px;
        position: relative;
      }

      .scan-browser-label {
        color: var(--yellow);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .scan-browser-title {
        color: white;
        font-size: 0.92rem;
        font-weight: 850;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .crawl-preview {
        background:
          linear-gradient(90deg, rgba(255, 230, 0, 0.08), transparent 38%),
          rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 12px;
        display: grid;
        gap: 9px;
        overflow: hidden;
        padding: 11px;
        position: relative;
      }

      .crawl-preview::after {
        animation: analyzeSweep 2.1s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.34), rgba(255, 50, 255, 0.22), transparent);
        content: "";
        inset: 0 auto 0 -55%;
        position: absolute;
        width: 46%;
      }

      .crawl-nav {
        display: flex;
        gap: 7px;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      .crawl-nav span {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        flex: 0 0 auto;
        height: 9px;
        width: 54px;
      }

      .crawl-page-lines {
        display: grid;
        gap: 7px;
        position: relative;
        z-index: 1;
      }

      .crawl-page-lines span {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        display: block;
        height: 8px;
      }

      .crawl-page-lines span:nth-child(1) {
        background: rgba(255, 230, 0, 0.4);
        width: 64%;
      }

      .crawl-page-lines span:nth-child(2) {
        width: 88%;
      }

      .crawl-page-lines span:nth-child(3) {
        width: 72%;
      }

      .crawl-trail {
        display: grid;
        gap: 6px;
      }

      .crawl-trail-item {
        align-items: center;
        color: #d7d7df;
        display: grid;
        font-size: 0.75rem;
        font-weight: 800;
        gap: 8px;
        grid-template-columns: 8px 1fr;
        min-width: 0;
      }

      .crawl-trail-item::before {
        background: rgba(196, 196, 208, 0.5);
        border-radius: 999px;
        content: "";
        height: 7px;
        width: 7px;
      }

      .crawl-trail-item.active::before {
        animation: pulseDot 1.2s ease-in-out infinite;
        background: var(--yellow);
        box-shadow: 0 0 14px rgba(255, 230, 0, 0.58);
      }

      .crawl-trail-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scan-dot {
        animation: pulseDot 1.45s ease-in-out infinite;
        background: var(--yellow);
        border-radius: 999px;
        box-shadow: 0 0 24px rgba(255, 230, 0, 0.72);
        height: 10px;
        position: absolute;
        width: 10px;
        z-index: 2;
      }

      .scan-dot.one {
        left: 22%;
        top: 36%;
      }

      .scan-dot.two {
        animation-delay: 0.24s;
        right: 24%;
        top: 62%;
      }

      .scan-dot.three {
        animation-delay: 0.48s;
        bottom: 24%;
        left: 46%;
      }

      .scan-panel {
        background: rgba(5, 5, 12, 0.58);
        border: 1px solid rgba(196, 196, 208, 0.16);
        border-radius: 22px;
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .scan-step {
        align-items: center;
        color: var(--muted);
        display: grid;
        font-size: 0.91rem;
        font-weight: 850;
        gap: 12px;
        grid-template-columns: 13px 1fr;
        line-height: 1.35;
      }

      .scan-step::before {
        background: rgba(196, 196, 208, 0.28);
        border-radius: 999px;
        content: "";
        height: 10px;
        width: 10px;
      }

      .scan-step.active::before {
        animation: pulseDot 1.25s ease-in-out infinite;
        background: var(--yellow);
        box-shadow: 0 0 16px rgba(255, 230, 0, 0.72);
      }

      .scan-step.complete {
        color: white;
      }

      .scan-step.complete::before {
        background: #ffe600;
        box-shadow: 0 0 12px rgba(255, 230, 0, 0.42);
      }

      .scan-log {
        border-top: 1px solid rgba(196, 196, 208, 0.14);
        color: #aaa6b8;
        display: grid;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 0.76rem;
        gap: 8px;

            uniform float uSpread;

            uniform float uSizeRandomness;
            uniform float uCameraDistance;

            varying vec3 vColor;

              pos.z *= 10.0;

              pos.y += sin(t * random.y + 6.28 * random.x) * mix(0.1, 1.5, random.w);

          const speed = 0.1;
          const cameraDistance = 20;
          const pixelRatio = 1;
          const palette = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];

          const positions = new Float32Array(particleCount * 3);
          const randoms = new Float32Array(particleCount * 4);
          const colors = new Float32Array(particleCount * 3);

          for (let index = 0; index < particleCount; index += 1) {
            let x = 0;
            let y = 0;
            let z = 0;
            let len = 0;
            do {
              x = Math.random() * 2 - 1;
              y = Math.random() * 2 - 1;
              z = Math.random() * 2 - 1;
              len = x * x + y * y + z * z;
            } while (len > 1 || len === 0);

            const radius = Math.cbrt(Math.random());
            positions.set([x * radius, y * radius, z * radius], index * 3);
            randoms.set([Math.random(), Math.random(), Math.random(), Math.random()], index * 4);
            colors.set(palette[Math.floor(Math.random() * palette.length)], index * 3);

            const location = gl.getAttribLocation(program, name);
            if (location < 0) return;

          let height = 1;

        } else {
          window.localStorage.removeItem(BACKEND_OVERRIDE_STORAGE_KEY);
        }
        return getConfiguredApiBaseUrl();
      }

      function clearApiBaseUrlOverride() {
        window.localStorage.removeItem(BACKEND_OVERRIDE_STORAGE_KEY);
        return getConfiguredApiBaseUrl();
      }

      function isCrossOriginApi(apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        if (!resolvedApiBaseUrl) return false;
        try {
          return new URL(resolvedApiBaseUrl).origin !== window.location.origin;
        } catch (_error) {
          return false;
        }
      }

      function buildApiHeaders(extraHeaders, apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        const headers = new Headers(extraHeaders || {});
        if (isCrossOriginApi(resolvedApiBaseUrl) && resolvedApiBaseUrl.includes("ngrok")) {
          headers.set("ngrok-skip-browser-warning", "true");
        }
        return headers;
      }

      function buildApiUrl(path, apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        if (!resolvedApiBaseUrl) return path;
        if (!path.startsWith("/")) return `${resolvedApiBaseUrl}/${path}`;
        return `${resolvedApiBaseUrl}${path}`;
      }

      async function apiFetch(path, options, apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        const requestOptions = { ...(options || {}) };
        requestOptions.headers = buildApiHeaders(requestOptions.headers, resolvedApiBaseUrl);
        const targetUrl = buildApiUrl(path, resolvedApiBaseUrl);
        try {
          return await fetch(targetUrl, requestOptions);
        } catch (_error) {
          const base = resolvedApiBaseUrl || window.location.origin;
          throw new Error(`Unable to reach backend API at ${base}. Confirm the Python server is running and update the Backend API URL in this form.`);
        }
      }

      async function readApiJson(response, fallbackMessage) {
        const contentType = response.headers.get("content-type") || "";
        const text = await response.text();
        const cleanText = text.trim();
        const looksLikeJson = cleanText.startsWith("{") || cleanText.startsWith("[");

        if (cleanText && (contentType.includes("application/json") || looksLikeJson)) {
          try {
            return JSON.parse(cleanText);
          } catch (_error) {
            throw new Error(`Backend returned malformed JSON from ${response.url || "the API"}.`);
          }
        }

        if (!cleanText && response.ok) {
          return {};
        }

        const preview = cleanText ? ` Preview: ${cleanText.slice(0, 120)}` : "";
        throw new Error(`${fallbackMessage || "Backend returned a non-JSON response."} Confirm the Backend API URL points to the active backend or ngrok URL.${preview}`);
      }

          if (!isMobileLiveAudit || mobileDiscovery || isDiscoveringMobile) return undefined;

          return undefined;
        }, [isMobileLiveAudit, mobileDiscovery, isDiscoveringMobile]);

        useEffect(() => {
          function updateTopbarFade() {
            const target = auditSectionRef.current;
            if (!target) {
              setTopbarFade(0);
              return;
            }

            const scrollY = window.scrollY || window.pageYOffset || 0;
            const auditTop = target.getBoundingClientRect().top + scrollY;
            const fadeStart = Math.max(0, auditTop - window.innerHeight * 1.15);
            const fadeEnd = Math.max(fadeStart + 1, auditTop - window.innerHeight * 0.15);
            const fade = (scrollY - fadeStart) / (fadeEnd - fadeStart);
            setTopbarFade(Math.min(1, Math.max(0, fade)));
          }

          let animationFrameId = 0;

          function handleScroll() {
            if (animationFrameId) return;
            animationFrameId = window.requestAnimationFrame(() => {
              animationFrameId = 0;
              updateTopbarFade();
            });
          }

          updateTopbarFade();
          window.addEventListener("scroll", handleScroll, { passive: true });
          window.addEventListener("resize", handleScroll);

          return () => {
            window.removeEventListener("scroll", handleScroll);
            window.removeEventListener("resize", handleScroll);
            if (animationFrameId) window.cancelAnimationFrame(animationFrameId);
          };
        }, []);

        useEffect(() => {
          if (!job || !["queued", "running"].includes(job.status)) return undefined;
          let cancelled = false;
          const poll = async () => {
            try {
              const response = await apiFetch(`/api/audits/${job.id}`);
              const payload = await readApiJson(response, "Unable to refresh the audit status.");
              if (!cancelled && response.ok) {
                setJob(payload);
              }
            } catch (pollError) {
              if (!cancelled) setError("Unable to refresh the audit status.");
            }
          };
          const timer = window.setInterval(poll, 2000);
          poll();
          return () => {
            cancelled = true;
            window.clearInterval(timer);
          };
        }, [job?.id, job?.status]);

        function scrollToAudit() {
          if (!auditSectionRef.current) return;
          auditSectionRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function setImageFiles(fileList) {
          const incoming = Array.from(fileList || []).filter((file) => file.type.startsWith("image/"));
          if (!incoming.length) return;
          setScreenshotFilesState((current) => {
            const existing = new Set(current.map((item) => `${item.file.name}-${item.file.size}-${item.file.lastModified}`));
            const additions = incoming
              .filter((file) => !existing.has(`${file.name}-${file.size}-${file.lastModified}`))
              .map((file, index) => ({
                id: screenshotRecordId(file, current.length + index),
                file,
                label: defaultScreenshotLabel(file, current.length + index),
                previewUrl: window.URL.createObjectURL(file),
              }));
            return current.concat(additions);
          });
        }

        function removeScreenshotFile(id) {
          setScreenshotFilesState((current) => {
            const match = current.find((item) => item.id === id);
            if (match) window.URL.revokeObjectURL(match.previewUrl);
            return current.filter((item) => item.id !== id);
          });
        }

        function updateScreenshotLabel(id, label) {
          setScreenshotFilesState((current) => current.map((item) => (item.id === id ? { ...item, label } : item)));
        }

        function applyDiscoveredMobileTarget(target, force) {
          if (!target) return;
          setMobileAppPackage((current) => (force || !current.trim() ? target.appPackage || current : current));
          setMobileAppActivity((current) => (force || !current.trim() ? target.appActivity || current : current));
          setMobileAppLabel((current) => {
            const clean = (current || "").trim();
            if (!force && clean && clean !== "Android App Audit") return current;
            return target.appLabel || clean || "Android App Audit";
          });
        }

        function applyMobileDiscovery(payload, forceTarget) {
          setMobileDiscovery(payload);
          const defaults = payload?.defaults || {};
          setMobileAppiumUrl((current) => current.trim() ? current : defaults.appiumUrl || "http://127.0.0.1:4723");
          setMobileDeviceName((current) => current.trim() && current !== "Android Emulator" ? current : defaults.deviceName || current || "Android Emulator");
          setMobilePlatformVersion((current) => current.trim() ? current : defaults.platformVersion || "");
          setMobileUdid((current) => current.trim() ? current : defaults.udid || "");

          const apps = Array.isArray(payload?.launchableApps) ? payload.launchableApps : [];
          const target = payload?.currentApp || apps[0] || null;
          applyDiscoveredMobileTarget(target, forceTarget);
        }

        async function discoverMobileTarget(forceTarget = false) {
          setIsDiscoveringMobile(true);
          try {
            const response = await apiFetch("/api/mobile/discovery");
            const payload = await readApiJson(response, "Unable to detect the connected Android app.");
            if (!response.ok) {
              throw new Error(payload.error || "Unable to detect the connected Android app.");
            }
            applyMobileDiscovery(payload, forceTarget);
            return payload;
          } catch (discoveryError) {
            setError(discoveryError.message || "Unable to detect the connected Android app.");
            return null;
          } finally {
            setIsDiscoveringMobile(false);
          }
        }

        function selectDiscoveredApp(indexValue) {
          const apps = Array.isArray(mobileDiscovery?.launchableApps) ? mobileDiscovery.launchableApps : [];
          const target = apps[Number(indexValue)];
          applyDiscoveredMobileTarget(target, true);
        }

        function handleUploadDrop(event) {
          event.preventDefault();
          setImageFiles(event.dataTransfer.files);
        }

        async function handleSubmit(event) {
          event.preventDefault();
          if (!canStart) return;
          setError("");
          setIsSubmitting(true);
          try {
            let response;
            if (isScreenshotAudit) {
              const formData = new FormData();
              formData.append("auditType", "screenshot");
              formData.append("surfaceType", screenshotSurfaceType);
              formData.append("siteName", siteName.trim() || (screenshotSurfaceType === "mobile_app" ? "Mobile App Screenshot Audit" : "Website Screenshot Audit"));
              formData.append(
                "screenshotLabels",
                JSON.stringify(screenshotFiles.map((item, index) => item.label.trim() || defaultScreenshotLabel(item.file, index)))
              );
              screenshotFiles.forEach((item) => formData.append("screenshots", item.file));
              response = await apiFetch("/api/audits", { method: "POST", body: formData });
            } else if (isMobileLiveAudit) {
              response = await apiFetch("/api/audits", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  auditType: "mobile",
                  appLabel: mobileAppLabel.trim() || "Android App Audit",
                  appPackage: mobileAppPackage.trim(),
                  appActivity: mobileAppActivity.trim(),
                  appiumUrl: mobileAppiumUrl.trim() || "http://127.0.0.1:4723",
                  deviceName: mobileDeviceName.trim() || "Android Emulator",
                  platformVersion: mobilePlatformVersion.trim(),
                  udid: mobileUdid.trim(),
                }),
              });
            } else {
              response = await apiFetch("/api/audits", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ auditType: "website", mode, url: url.trim() }),
              });
            }

            const payload = await readApiJson(response, "Unable to start the audit.");
            if (!response.ok) {
              throw new Error(payload.error || "Unable to start the audit.");
            }
            setJob(payload);
            setIsModalOpen(true);
          } catch (submitError) {
            setError(submitError.message || "Unable to start the audit.");
          } finally {
            setIsSubmitting(false);
          }
        }

        async function handleStopAudit() {
          if (!job || !["queued", "running"].includes(job.status) || isStopping) return;
          setError("");
          setIsStopping(true);
          try {
            const response = await apiFetch(`/api/audits/${job.id}/cancel`, { method: "POST" });
            const payload = await readApiJson(response, "Unable to stop the audit.");
            if (!response.ok) {
              throw new Error(payload.error || "Unable to stop the audit.");
            }
            setJob(payload);
            setIsModalOpen(true);
          } catch (stopError) {
            setError(stopError.message || "Unable to stop the audit.");
          } finally {
            setIsStopping(false);
          }
        }

        return e(
          "div",
          { className: "app-shell view-home" },
          e(
            "header",
            {
              className: `topbar ${topbarFade > 0.86 ? "is-fading" : ""}`.trim(),
              style: {
                opacity: 1 - topbarFade,
                transform: `translateX(-50%) translateY(${-topbarFade * 12}px)`,
              },
            },
            e(BrandLockup),
            e(
              "nav",
              { className: "home-nav", "aria-label": "Home navigation" },
              e("a", { href: "#features" }, "Features"),
              e("a", { href: "#about" }, "About"),
              e("button", { type: "button", onClick: scrollToAudit }, "Launch")
            )
          ),
          e(
            "main",
            { className: "page" },
            e(Hero, { onLaunch: scrollToAudit }),
            e(
              "section",
              { className: "launch-section", id: "audit", ref: auditSectionRef, "aria-labelledby": "launch-heading" },
              e(
                "div",
                { className: "launch-copy" },
                e("div", { className: "ey-pill" }, "Audit Launch System"),
                e(
                  "h2",
                  { id: "launch-heading" },
                  "Launch a ",
                  e("span", { className: "accent" }, "client ready"),
                  " audit"
                ),
                e("p", null, "A calmer setup surface for website and mobile reviews, with clearer decisions before the run starts."),
                e(
                  "div",
                  { className: "process-list" },
                  e(ProcessStep, { number: "1", title: "Choose the audit path", text: "Pick website or mobile, then decide whether the source is live or screenshot-based." }),
                  e(ProcessStep, { number: "2", title: "Configure the source", text: "Enter the core inputs with one consistent, design-system style panel." }),
                  e(ProcessStep, { number: "3", title: isMobileLiveAudit ? "Inspect artifacts" : "Open the output", text: completionText })
                )
              ),
              e(
                "form",
                { className: "audit-panel", onSubmit: handleSubmit },
                e("h2", null, "Start a new run"),
                e("p", { className: "panel-subtitle" }, "Configure the audit inputs inside the first Fabric Motif launcher pass."),
                e("div", { className: "field-legend" }, "Choose Experience"),
                e(
                  "div",
                  { className: "choice-stack", role: "radiogroup", "aria-label": "Experience type" },
                  e(AuditChoice, {
                    active: experienceType === "website",
                    icon: "globe",
                    onClick: () => setExperienceType("website"),
                    title: "Website audit",
                    text: "Audit a live website URL or uploaded website screenshots",
                  }),
                  e(AuditChoice, {
                    active: experienceType === "mobile",
                    icon: "phone",
                    onClick: () => setExperienceType("mobile"),
                    title: "Mobile app audit",
                    text: "Audit a live mobile app session or uploaded app screenshots",

                experienceType === "website" &&
                  e(

                    null,
                    e("div", { className: "field-legend", style: { marginTop: "24px" } }, "Website Input"),
                    e(
                      "div",
                      { className: "choice-stack", role: "radiogroup", "aria-label": "Website input type" },

                    e(

                      { className: "choice-stack", role: "radiogroup", "aria-label": "Mobile input type" },

                        icon: "phone",

                  e(Icon, { name: "arrow" })
                ),
                job && e(StatusStrip, { job, isStopping, onOpen: () => setIsModalOpen(true), onStop: handleStopAudit })
              )
            )
          ),
          isModalOpen && job && e(ProgressModal, { job, error, isStopping, onClose: () => setIsModalOpen(false), onStop: handleStopAudit })
        );

          e(

            { className: "hero-content" },
            e("div", { className: "hero-release" }, e("span", null, " UX/UI AUDITOR")),
            e(

              { id: "hero-title" },
              "Fix Faster ",

              { className: "hero-actions" },
              e("button", { className: "primary start-button", type: "button", onClick: onLaunch }, "Get started")
              
            )

        );
