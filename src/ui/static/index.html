<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UX/UI Auditor</title>
    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.6.3/dist/es-module-shims.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@v0.151.3/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/",
          "ogl": "https://cdn.jsdelivr.net/npm/ogl/dist/ogl.mjs"
        }
      }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/gsap@3.11.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.11.5/dist/ScrollTrigger.min.js"></script>
    <script src="./config.js"></script>
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("UX_UI_AUDITOR_THEME");
          document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
        } catch (_error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #232332;
        --bg-2: #2b2c3c;
        --panel: rgba(37, 37, 51, 0.88);
        --panel-strong: rgba(48, 49, 66, 0.94);
        --panel-soft: rgba(255, 255, 255, 0.045);
        --line: rgba(168, 160, 209, 0.18);
        --line-strong: rgba(206, 123, 255, 0.34);
        --text: #f7f4ff;
        --muted: #beb7d5;
        --faint: #8d88a7;
        --purple: #9b63ff;
        --violet: #6374ff;
        --pink: #f15bb5;
        --magenta: #da52ff;
        --orange: #ff8a5b;
        --red: #ff5c7a;
        --yellow: #ffe100;
        --lime: #b4ff00;
        --green: #37d67a;
        --teal: #71ddff;
        --blue: #4f66ff;
        --danger: #ff6a7d;
        --success: #2db757;
        --shadow: 0 34px 96px rgba(7, 8, 18, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
        scroll-behavior: smooth;
        width: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Aptos, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: -0.01em;
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        width: 100%;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      input[type="file"] {
        cursor: pointer;
      }

      .app-shell {
        background:
          radial-gradient(circle at 12% 8%, rgba(82, 101, 255, 0.18), transparent 20rem),
          radial-gradient(circle at 84% 8%, rgba(217, 86, 164, 0.2), transparent 20rem),
          radial-gradient(circle at 94% 16%, rgba(134, 88, 255, 0.22), transparent 16rem),
          linear-gradient(180deg, #1f2030 0%, #232332 44%, #272738 100%);
        isolation: isolate;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }

      .app-shell::before {
        background:
          linear-gradient(110deg, rgba(0, 0, 0, 0) 0%, rgba(86, 103, 255, 0.18) 18%, rgba(168, 99, 255, 0.24) 46%, rgba(242, 96, 168, 0.2) 74%, rgba(255, 224, 0, 0.15) 100%);
        content: "";
        filter: blur(68px);
        height: 260px;
        left: 16%;
        opacity: 0.78;
        pointer-events: none;
        position: absolute;
        right: -8%;
        top: -112px;
        transform: rotate(5deg);
        z-index: -1;
      }

      .app-shell::after {
        background:
          radial-gradient(circle at center, rgba(158, 98, 255, 0.16), transparent 56%),
          repeating-radial-gradient(circle at center, rgba(214, 94, 164, 0.12) 0, rgba(214, 94, 164, 0.12) 2px, transparent 2px, transparent 18px);
        border-radius: 999px;
        content: "";
        height: 340px;
        opacity: 0.2;
        pointer-events: none;
        position: absolute;
        right: -110px;
        top: -44px;
        width: 340px;
        z-index: -1;
      }

      .view-home.app-shell {
        background:
          radial-gradient(ellipse at 50% -6%, rgba(91, 73, 128, 0.38), rgba(26, 20, 38, 0.3) 18rem, transparent 50rem),
          radial-gradient(ellipse at 50% 42vh, rgba(72, 56, 105, 0.2), transparent 62vh),
          radial-gradient(ellipse at 52% 118vh, rgba(102, 82, 142, 0.16), transparent 76vh),
          linear-gradient(180deg, #0d0a12 0%, #100d17 36%, #11101b 68%, #0d0a12 100%);
      }

      .view-home.app-shell::before {
        background:
          radial-gradient(ellipse at 50% 12%, rgba(187, 153, 255, 0.11), transparent 34rem),
          radial-gradient(ellipse at 48% 78%, rgba(232, 103, 174, 0.055), transparent 40rem);
        content: "";
        filter: blur(38px);
        height: 140vh;
        left: 0;
        opacity: 0.9;
        pointer-events: none;
        position: fixed;
        right: 0;
        top: -18vh;
        transform: none;
        z-index: 0;
      }

      .view-home.app-shell::after {
        display: none;
      }

      .topbar {
        align-items: center;
        backdrop-filter: blur(22px);
        background: rgba(29, 30, 43, 0.82);
        border-bottom: 1px solid rgba(167, 157, 214, 0.14);
        display: flex;
        justify-content: space-between;
        min-height: 82px;
        padding: 0 clamp(24px, 7vw, 132px);
        position: sticky;
        top: 0;
        transform: translateY(0);
        transition: opacity 0.18s ease, transform 0.18s ease;
        z-index: 30;
      }

      .view-home .topbar {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        left: 50%;
        margin: 18px auto 0;
        max-width: min(736px, calc(100% - 36px));
        min-height: 60px;
        padding: 0 10px 0 18px;
        position: fixed;
        transform: translateX(-50%);
        width: 100%;
      }

      .topbar.is-fading {
        pointer-events: none;
      }

      .view-home .brand-logo {
        width: 126px;
      }

      .home-nav {
        align-items: center;
        display: none;
        gap: 24px;
        margin-left: auto;
      }

      .view-home .home-nav {
        display: flex;
      }

      .home-nav a {
        color: rgba(247, 244, 255, 0.54);
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
      }

      .home-nav button {
        background: #f7f7f8;
        border: 0;
        border-radius: 10px;
        color: #101018;
        cursor: pointer;
        font-weight: 850;
        min-height: 38px;
        padding: 0 22px;
      }

      .brand {
        align-items: center;
        display: flex;
        min-width: 0;
      }

      .brand-logo {
        color: #ffffff;
        display: block;
        height: auto;
        width: clamp(118px, 11vw, 154px);
      }

      .topbar-meta {
        align-items: center;
        color: #d9d2ee;
        display: inline-flex;
        font-size: 0.9rem;
        font-weight: 700;
        gap: 10px;
        letter-spacing: 0.02em;
      }

      .topbar-mark {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(214, 201, 255, 0.82));
        border-radius: 999px 999px 999px 220px;
        display: inline-block;
        height: 18px;
        position: relative;
        width: 28px;
      }

      .topbar-mark::after {
        background: rgba(29, 30, 43, 0.9);
        border-radius: 999px;
        content: "";
        height: 10px;
        left: 9px;
        position: absolute;
        top: 4px;
        width: 10px;
      }

      .page {
        margin: 0 auto;
        max-width: 1440px;
        padding: 0 clamp(22px, 7vw, 96px) 96px;
      }

      .view-home .page {
        max-width: none;
        padding: 0;
        position: relative;
        z-index: 1;
      }

      .page {
        overflow-x: hidden;
      }

      .intro-sequence {
        background: transparent;
        isolation: isolate;
        min-height: 100vh;
        position: relative;
      }

      .intro-sequence::after {
        display: none;
      }

      .hero {
        align-items: center;
        display: grid;
        justify-items: center;
        isolation: isolate;
        min-height: 100vh;
        padding: 132px 24px 92px;
        position: relative;
        background: transparent;
        overflow: hidden;
      }

      .intro-sequence > .hero {
        position: relative;
        z-index: 1;
      }

      .hero::before {
        animation: heroAurora 30s ease-in-out infinite alternate;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.04), transparent 16rem),
          radial-gradient(circle at 74% 18%, rgba(156, 128, 220, 0.08), transparent 18rem),
          radial-gradient(circle at 62% 84%, rgba(255, 255, 255, 0.045), transparent 26rem);
        content: "";
        filter: blur(34px);
        height: 80%;
        left: -6%;
        opacity: 0.88;
        pointer-events: none;
        position: absolute;
        right: -6%;
        top: -10%;
        z-index: 0;
      }

      .hero::after {
        background:
          radial-gradient(circle at center, rgba(14, 11, 19, 0) 0%, rgba(14, 11, 19, 0.03) 48%, rgba(14, 11, 19, 0.42) 100%);
        content: "";
        inset: 0;
        opacity: 1;
        pointer-events: none;
        position: absolute;
        z-index: 0;
      }

      .hero > * {
        position: relative;
        z-index: 1;
      }

      .hero-content {
        align-items: center;
        display: grid;
        filter: blur(var(--hero-blur, 0px));
        justify-items: center;
        max-width: 860px;
        opacity: var(--hero-opacity, 1);
        text-align: center;
        transform: translate3d(0, var(--hero-lift, 0px), 0) scale(var(--hero-scale, 1));
        transform-origin: center;
        will-change: opacity, filter, transform;
      }

      .hero > .hero-particles {
        z-index: 0;
      }

      .hero-particles {
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        position: absolute;
      }

      .hero-particles-canvas {
        display: block;
        height: 100%;
        opacity: var(--particle-opacity, 0.92);
        transform: scale(var(--particle-scale, 1));
        transform-origin: center;
        width: 100%;
        will-change: opacity, transform;
      }

      .scroll-transition {
        display: grid;
        justify-items: center;
        margin-top: -24vh;
        min-height: 68vh;
        overflow: visible;
        pointer-events: none;
        position: relative;
        z-index: 4;
      }

      .scroll-transition::before {
        background:
          radial-gradient(ellipse at center, rgba(180, 143, 255, 0.2), rgba(117, 112, 255, 0.08) 34%, transparent 68%),
          radial-gradient(ellipse at 58% 52%, rgba(238, 103, 174, 0.1), transparent 62%);
        content: "";
        filter: blur(42px);
        height: 54vh;
        left: -8%;
        opacity: var(--bridge-soft-opacity, 0);
        position: absolute;
        right: -8%;
        top: 8vh;
      }

      .transition-stage {
        align-items: center;
        display: grid;
        justify-items: center;
        min-height: 68vh;
        opacity: var(--bridge-opacity, 0);
        position: sticky;
        top: 0;
        transform: translate3d(0, var(--bridge-rise, 120px), 0) scale(var(--bridge-scale, 0.84));
        transform-origin: center;
        width: 100%;
        will-change: opacity, transform;
      }

      .transition-flow {
        height: clamp(220px, 28vw, 360px);
        position: relative;
        transform: perspective(900px) rotateX(58deg) rotateZ(-2deg);
        transform-origin: center;
        width: min(86vw, 980px);
      }

      .transition-flow::before {
        animation: signalBreath 6s ease-in-out infinite alternate;
        background:
          radial-gradient(ellipse at 52% 52%, rgba(255, 255, 255, 0.16), transparent 18%),
          radial-gradient(ellipse at 50% 50%, rgba(158, 112, 255, 0.22), transparent 48%),
          linear-gradient(100deg, transparent 6%, rgba(98, 111, 255, 0.08) 24%, rgba(255, 255, 255, 0.22) 48%, rgba(237, 91, 176, 0.12) 72%, transparent 94%);
        border-radius: 999px;
        content: "";
        filter: blur(30px);
        inset: 10% -8%;
        opacity: 0.68;
        position: absolute;
      }

      .transition-flow::after {
        background:
          radial-gradient(ellipse at center, rgba(206, 180, 255, 0.16), transparent 58%),
          linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
        content: "";
        filter: blur(20px);
        height: 46%;
        left: 12%;
        opacity: 0.7;
        position: absolute;
        right: 12%;
        top: 34%;
      }

      .transition-rail {
        filter:
          drop-shadow(0 0 20px rgba(131, 113, 255, 0.36))
          drop-shadow(0 0 42px rgba(238, 91, 177, 0.2));
        height: 100%;
        inset: 0;
        overflow: visible;
        position: absolute;
        width: 100%;
      }

      .transition-rail path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .transition-rail-glow {
        filter: blur(8px);
        opacity: 0.34;
        stroke: url(#transitionSignalGradient);
        stroke-width: 28;
      }

      .transition-rail-line {
        opacity: 0.74;
        stroke: url(#transitionSignalGradient);
        stroke-width: 3;
      }

      .transition-rail-dash {
        animation: signalDash 2.6s linear infinite;
        opacity: 0.78;
        stroke: rgba(255, 255, 255, 0.9);
        stroke-dasharray: 10 42;
        stroke-width: 4;
      }

      .signal-node {
        animation: signalNodePulse 3.8s ease-in-out infinite;
        background:
          radial-gradient(circle, #ffffff 0 18%, rgba(255, 255, 255, 0.42) 19% 38%, transparent 40%),
          radial-gradient(circle, rgba(177, 128, 255, 0.42), transparent 66%);
        border-radius: 999px;
        box-shadow:
          0 0 18px rgba(255, 255, 255, 0.32),
          0 0 46px rgba(162, 112, 255, 0.28);
        height: 30px;
        position: absolute;
        transform: translate(-50%, -50%);
        width: 30px;
      }

      .signal-node:nth-of-type(1) {
        animation-delay: -0.6s;
        left: 18%;
        top: 64%;
      }

      .signal-node:nth-of-type(2) {
        animation-delay: -1.8s;
        left: 48%;
        top: 43%;
      }

      .signal-node:nth-of-type(3) {
        animation-delay: -2.6s;
        left: 78%;
        top: 55%;
      }

      .signal-sweep {
        animation: signalSweep 4.4s cubic-bezier(0.45, 0, 0.2, 1) infinite;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.24), rgba(246, 96, 187, 0.18), transparent);
        border-radius: 999px;
        filter: blur(7px);
        height: 46%;
        left: -18%;
        opacity: 0;
        position: absolute;
        top: 30%;
        transform: rotate(-8deg);
        width: 24%;
      }

      .transition-caption {
        align-items: center;
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
        color: rgba(247, 244, 255, 0.7);
        display: inline-flex;
        gap: 12px;
        margin-top: -40px;
        padding: 10px 18px;
        position: relative;
        z-index: 2;
      }

      .transition-caption span {
        background: #f7f7f8;
        border-radius: 999px;
        color: #111018;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        padding: 7px 11px;
        text-transform: uppercase;
      }

      .transition-caption strong {
        font-size: 0.92rem;
      }

      .ey-pill {
        align-items: center;
        background: rgba(157, 111, 255, 0.08);
        border: 1px solid rgba(171, 141, 255, 0.18);
        border-radius: 999px;
        color: #d7c5ff;
        display: inline-flex;
        font-size: 0.72rem;
        font-weight: 800;
        gap: 9px;
        letter-spacing: 0.18em;
        line-height: 1;
        padding: 10px 16px;
        text-transform: uppercase;
        width: fit-content;
      }

      .hero h1,
      .launch-copy h2 {
        color: var(--text);
        font-size: clamp(3rem, 6vw, 5rem);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.08;
        margin: 30px 0 34px;
        max-width: 860px;
      }

      .accent {
        background: linear-gradient(90deg, #79a0ff 0%, #b96aff 45%, #ff72b6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-block;
      }

      .hero-copy,
      .launch-copy p {
        color: #c9c2db;
        font-size: clamp(1rem, 1.12vw, 1.08rem);
        line-height: 1.7;
        margin: 0;
        max-width: 460px;
      }

      .hero-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin-top: 12px;
      }

      .hero-actions .hero-liquid-button {
        backdrop-filter: blur(18px) saturate(145%);
        -webkit-backdrop-filter: blur(18px) saturate(145%);
        border-radius: 12px;
        box-shadow:
          0 16px 34px rgba(0, 0, 0, 0.26),
          inset 1px 1px 0 rgba(255, 255, 255, 0.12);
        min-height: 50px;
        min-width: 136px;
        overflow: hidden;
        padding: 0 26px;
        position: relative;
      }

      .hero-actions .hero-liquid-button::before {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
        border-radius: inherit;
        content: "";
        inset: 1px;
        opacity: 0.7;
        pointer-events: none;
        position: absolute;
      }

      .hero-actions .hero-liquid-button::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34), transparent);
        content: "";
        height: 180%;
        left: -36%;
        opacity: 0.66;
        pointer-events: none;
        position: absolute;
        top: -38%;
        transform: rotate(18deg);
        transition: transform 0.38s ease, opacity 0.38s ease;
        width: 40%;
      }

      .hero-actions .hero-liquid-button > * {
        position: relative;
        z-index: 1;
      }

      .hero-actions .hero-liquid-button .icon {
        margin-left: 2px;
      }

      .hero-actions .hero-liquid-button:hover {
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.32),
          inset 1px 1px 0 rgba(255, 255, 255, 0.16);
        transform: translateY(-1px);
      }

      .hero-actions .hero-liquid-button:hover::after {
        opacity: 0.8;
        transform: translateX(24px) rotate(18deg);
      }

      .hero-actions .hero-liquid-button.primary {
        background: #f7f7f8;
        border: 1px solid rgba(255, 255, 255, 0.9);
        color: #111018;
      }

      .hero-actions .hero-liquid-button.secondary {
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(247, 244, 255, 0.62);
      }

      .hero-signature {
        align-items: center;
        color: #f0ebff;
        display: inline-flex;
        font-size: 0.98rem;
        font-weight: 500;
        gap: 10px;
        margin-top: 24px;
        opacity: 0.9;
      }

      .hero-release {
        align-items: center;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        color: rgba(247, 244, 255, 0.52);
        display: inline-flex;
        font-size: 0.9rem;
        font-weight: 750;
        gap: 12px;
        padding: 6px 16px 6px 7px;
      }

      .hero-release strong {
        background: #f7f7f8;
        border-radius: 999px;
        color: #111018;
        font-size: 0.8rem;
        padding: 7px 12px;
      }

      .hero-signature-mark {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(214, 201, 255, 0.82));
        border-radius: 999px 999px 999px 220px;
        display: inline-block;
        height: 18px;
        position: relative;
        width: 28px;
      }

      .hero-signature-mark::after {
        background: rgba(29, 30, 43, 0.88);
        border-radius: 999px;
        content: "";
        height: 10px;
        left: 9px;
        position: absolute;
        top: 4px;
        width: 10px;
      }

      .primary,
      .secondary,
      .ghost {
        align-items: center;
        border-radius: 999px;
        cursor: pointer;
        display: inline-flex;
        font-weight: 850;
        gap: 10px;
        justify-content: center;
        min-height: 58px;
        padding: 0 28px;
        text-decoration: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease, background 0.18s ease, color 0.18s ease;
      }

      .primary {
        background: linear-gradient(180deg, #ffe828 0%, #ffe100 100%);
        border: 1px solid rgba(255, 234, 117, 0.74);
        box-shadow: 0 16px 36px rgba(255, 225, 0, 0.2);
        color: #252535;
      }

      .primary:hover,
      .secondary:hover,
      .ghost:hover {
        transform: translateY(-1px);
      }

      .primary:disabled {
        cursor: not-allowed;
        opacity: 0.45;
        transform: none;
      }

      .secondary,
      .ghost {
        background: rgba(52, 53, 71, 0.62);
        border: 1px solid rgba(161, 154, 198, 0.16);
        color: white;
      }

      .compact {
        min-height: 46px;
        padding: 0 18px;
        white-space: nowrap;
      }

      .ghost {
        border-color: rgba(161, 154, 198, 0.14);
        min-height: 46px;
        padding: 0 18px;
      }

      .stop-button {
        border-color: rgba(255, 107, 107, 0.52);
        color: #ffd0d0;
      }

      .stop-button:hover {
        background: rgba(255, 107, 107, 0.12);
        border-color: rgba(255, 107, 107, 0.78);
      }

      .criteria-launcher {
        bottom: 22px;
        left: 22px;
        border-radius: 999px;
        height: 52px;
        min-height: 52px;
        padding: 0;
        position: fixed;
        width: 52px;
        z-index: 40;
      }

      .criteria-launcher .icon {

        border-radius: 999px;

        cursor: pointer;
        display: flex;
        font-size: 0.76rem;
        font-weight: 900;
        height: 28px;
        justify-content: center;
        padding: 0;
        position: absolute;
        right: 8px;
        top: 8px;
        width: 28px;
      }

      .screenshot-label-input {
        border-radius: 12px !important;
        font-size: 0.88rem !important;
        min-height: 42px !important;
        padding: 0 10px !important;
      }

      .start-button {
        margin-top: 30px;
        min-height: 58px;
        width: 100%;
      }

      .error {
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid rgba(255, 107, 107, 0.35);
        border-radius: 14px;
        color: #ffd0d0;
        line-height: 1.45;
        margin-top: 18px;
        padding: 14px 16px;
      }

      .status-strip {
        align-items: center;
        background: rgba(51, 52, 70, 0.62);
        border: 1px solid rgba(161, 154, 198, 0.16);
        border-radius: 22px;
        color: var(--muted);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 22px;
        padding: 14px 16px;
      }

      .status-strip strong {
        color: white;
      }

      .progress-wrap {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        height: 11px;
        overflow: hidden;
        width: 100%;
      }

      .progress {
        background: linear-gradient(90deg, #6070ff 0%, #b669ff 54%, #f06abf 100%);
        height: 100%;
        transition: width 0.35s ease;
      }

      .modal-backdrop {
        align-items: center;
        background:
          radial-gradient(circle at 50% 8%, rgba(255, 230, 0, 0.1), transparent 28rem),
          rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(18px);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 24px;
        position: fixed;
        z-index: 100;
      }

      .modal {
        background:
          radial-gradient(circle at 86% 0%, rgba(255, 230, 0, 0.12), transparent 12rem),
          radial-gradient(circle at 74% 8%, rgba(247, 125, 30, 0.14), transparent 16rem),
          radial-gradient(circle at 12% 18%, rgba(132, 0, 255, 0.16), transparent 18rem),
          rgba(26, 26, 36, 0.98);
        border: 1px solid rgba(196, 196, 208, 0.18);
        border-radius: 28px;
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        max-height: min(900px, 92vh);
        max-width: 1060px;
        overflow: auto;
        padding: clamp(26px, 4vw, 46px);
        position: relative;
        width: 100%;
      }

      .modal::before {
        background:
          linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.42), transparent);
        content: "";
        height: 1px;
        left: 30px;
        opacity: 0.7;
        position: absolute;
        right: 30px;
        top: 0;
      }

      .modal-head {
        align-items: start;
        display: flex;
        gap: 18px;
        justify-content: space-between;
      }

      .modal h2 {
        font-size: clamp(2.4rem, 5.2vw, 4.45rem);
        letter-spacing: 0;
        line-height: 1.05;
        margin: 24px 0 14px;
        max-width: 790px;
      }

      .stage {
        color: var(--muted);
        font-weight: 750;
        line-height: 1.5;
        margin: 0 0 26px;
        max-width: 720px;
      }

      .criteria-modal {
        display: flex;
        flex-direction: column;
        height: min(900px, 92vh);
        max-width: 1160px;
        overflow: hidden;
      }

      .criteria-editor-layout {
        display: grid;
        flex: 1 1 auto;
        gap: 22px;
        grid-template-columns: minmax(210px, 0.28fr) minmax(0, 1fr);
        margin-top: 24px;
        min-height: 0;
        overflow: hidden;
      }

      .criteria-axis-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }

      .criteria-axis-list {
        align-content: start;
        display: grid;
        flex: 1 1 auto;
        gap: 8px;
        grid-auto-rows: max-content;
        min-height: 0;
        overflow-y: auto;
        padding-right: 6px;
      }

      .criteria-axis-tab {
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(168, 160, 209, 0.16);
        border-radius: 12px;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.98rem;
        font-weight: 850;
        line-height: 1.2;
        min-height: 48px;
        padding: 10px 14px;
        text-align: left;
      }

      .criteria-axis-tab.active {
        background: linear-gradient(180deg, #ffe828 0%, #ffe100 100%);
        border-color: rgba(255, 234, 117, 0.76);
        color: #252535;
      }

      .criteria-add-axis {
        flex: 0 0 auto;
        justify-content: center;
        min-height: 48px;
        width: 100%;
      }

      .criteria-editor-form {
        display: grid;
        gap: 18px;
        min-height: 0;
        overflow-y: auto;
        padding-right: 10px;
      }

      .criteria-editor-form textarea {
        background: rgba(16, 16, 28, 0.46);
        border: 1px solid rgba(168, 160, 209, 0.18);
        border-radius: 14px;
        color: var(--text);
        font: inherit;
        min-height: 108px;
        padding: 14px 16px;
        resize: vertical;
        width: 100%;
      }

      .criteria-editor-form textarea.small {
        min-height: 76px;
      }

      .criteria-editor-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 18px;
      }

      .criteria-status {
        color: var(--muted);
        font-weight: 750;
        margin-right: auto;
      }

      .scan-layout {
        align-items: stretch;
        display: grid;
        gap: 22px;
        grid-template-columns: minmax(360px, 1fr) minmax(230px, 0.45fr);
        margin: 28px 0 26px;
      }

      .scan-frame {
        aspect-ratio: 16 / 9;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 50, 255, 0.1), transparent 32%),
          rgba(5, 5, 12, 0.72);
        border: 1px solid rgba(255, 230, 0, 0.22);
        border-radius: 22px;
        box-shadow: inset 0 0 60px rgba(255, 230, 0, 0.07);
        min-height: 320px;
        overflow: hidden;
        position: relative;
      }

      .scan-frame::before,
      .scan-frame::after {
        content: "";
        left: 12%;
        position: absolute;
        right: 12%;
      }

      .scan-frame::before {
        animation: scanLineMove 6.5s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.96), transparent);
        box-shadow: 0 0 24px rgba(255, 230, 0, 0.62);
        height: 3px;
        top: 0;
        z-index: 4;
      }

      .scan-frame::after {
        animation: scanSweep 2.6s ease-in-out infinite;
        background: linear-gradient(180deg, transparent, rgba(255, 50, 255, 0.26), transparent);
        height: 34%;
        top: -22%;
        z-index: 4;
      }

      .scan-corner {
        border-color: rgba(255, 255, 255, 0.95);
        border-style: solid;
        height: 84px;
        position: absolute;
        width: 84px;
        z-index: 3;
      }

      .scan-corner.tl {
        border-width: 10px 0 0 10px;
        border-radius: 26px 0 0 0;
        left: 32px;
        top: 32px;
      }

      .scan-corner.tr {
        border-width: 10px 10px 0 0;
        border-radius: 0 26px 0 0;
        right: 32px;
        top: 32px;
      }

      .scan-corner.bl {
        border-width: 0 0 10px 10px;
        border-radius: 0 0 0 26px;
        bottom: 32px;
        left: 32px;
      }

      .scan-corner.br {
        border-width: 0 10px 10px 0;
        border-radius: 0 0 26px 0;
        bottom: 32px;
        right: 32px;
      }

      .scan-core {
        background: rgba(7, 7, 13, 0.72);
        border: 1px solid rgba(255, 230, 0, 0.22);
        border-radius: 14px;
        left: 22px;
        max-width: min(360px, calc(100% - 44px));
        min-width: 0;
        padding: 12px 14px;
        position: absolute;
        text-align: left;
        top: 22px;
        transform: none;
        z-index: 6;
      }

      .scan-core strong {
        color: white;
        display: block;
        font-size: clamp(0.94rem, 1.35vw, 1.12rem);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scan-core span {
        color: var(--yellow);
        font-size: 0.78rem;
        font-weight: 850;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .scan-real-shot {
        background: rgba(255, 255, 255, 0.04);
        animation: realPageScroll 11s ease-in-out infinite;
        display: block;
        height: 100%;
        inset: 0;
        object-fit: cover;
        object-position: top center;
        position: absolute;
        width: 100%;
        z-index: 3;
      }

      .scan-frame.has-preview .scan-live-frame {
        opacity: 0;
      }

      .scan-live-frame {
        background: rgba(5, 5, 12, 0.92);
        border: 0;
        display: block;
        height: 100%;
        inset: 0;
        pointer-events: none;
        position: absolute;
        transition: opacity 0.25s ease;
        width: 100%;
        z-index: 2;
      }

      .scan-frame.has-live .scan-real-shot {
        opacity: 0.72;
      }

      .scan-empty-state {
        align-items: center;
        color: var(--muted);
        display: grid;
        font-weight: 850;
        gap: 10px;
        inset: 0;
        justify-items: center;
        padding: 28px;
        position: absolute;
        text-align: center;
        z-index: 1;
      }

      .scan-empty-state strong {
        color: white;
        font-size: 1.15rem;
      }

      .scan-browser {
        background: rgba(12, 12, 20, 0.82);
        border: 1px solid rgba(255, 230, 0, 0.18);
        border-radius: 16px;
        box-shadow: 0 22px 58px rgba(0, 0, 0, 0.32);
        bottom: 22px;
        left: 50%;
        min-width: min(640px, calc(100% - 84px));
        overflow: hidden;
        position: absolute;
        transform: translateX(-50%);
        z-index: 5;
      }

      .scan-browser-top {
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: grid;
        gap: 10px;
        grid-template-columns: auto 1fr;
        min-height: 42px;
        padding: 8px 12px;
      }

      .scan-browser-dots {
        display: flex;
        gap: 6px;
      }

      .scan-browser-dots span {
        border-radius: 999px;
        height: 9px;
        width: 9px;
      }

      .scan-browser-dots span:nth-child(1) {
        background: #ff5f57;
      }

      .scan-browser-dots span:nth-child(2) {
        background: #ffbd2e;
      }

      .scan-browser-dots span:nth-child(3) {
        background: #28c840;
      }

      .scan-browser-address {
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        color: #f1edf8;
        font-size: 0.78rem;
        font-weight: 800;
        overflow: hidden;
        padding: 7px 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scan-browser-body {
        display: none;
        gap: 10px;
        padding: 13px 14px 15px;
        position: relative;
      }

      .scan-browser-label {
        color: var(--yellow);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .scan-browser-title {
        color: white;
        font-size: 0.92rem;
        font-weight: 850;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .crawl-preview {
        background:
          linear-gradient(90deg, rgba(255, 230, 0, 0.08), transparent 38%),
          rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 12px;
        display: grid;
        gap: 9px;
        overflow: hidden;
        padding: 11px;
        position: relative;
      }

      .crawl-preview::after {
        animation: analyzeSweep 2.1s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, rgba(255, 230, 0, 0.34), rgba(255, 50, 255, 0.22), transparent);
        content: "";
        inset: 0 auto 0 -55%;
        position: absolute;
        width: 46%;
      }

      .crawl-nav {
        display: flex;
        gap: 7px;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      .crawl-nav span {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        flex: 0 0 auto;
        height: 9px;
        width: 54px;
      }

      .crawl-page-lines {
        display: grid;
        gap: 7px;
        position: relative;
        z-index: 1;
      }

      .crawl-page-lines span {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        display: block;
        height: 8px;
      }

      .crawl-page-lines span:nth-child(1) {
        background: rgba(255, 230, 0, 0.4);
        width: 64%;
      }

      .crawl-page-lines span:nth-child(2) {
        width: 88%;
      }

      .crawl-page-lines span:nth-child(3) {
        width: 72%;
      }

      .crawl-trail {
        display: grid;
        gap: 6px;
      }

      .crawl-trail-item {
        align-items: center;
        color: #d7d7df;
        display: grid;
        font-size: 0.75rem;
        font-weight: 800;
        gap: 8px;
        grid-template-columns: 8px 1fr;
        min-width: 0;
      }

      .crawl-trail-item::before {
        background: rgba(196, 196, 208, 0.5);
        border-radius: 999px;
        content: "";
        height: 7px;
        width: 7px;
      }

      .crawl-trail-item.active::before {
        animation: pulseDot 1.2s ease-in-out infinite;
        background: var(--yellow);
        box-shadow: 0 0 14px rgba(255, 230, 0, 0.58);
      }

      .crawl-trail-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scan-dot {
        animation: pulseDot 1.45s ease-in-out infinite;
        background: var(--yellow);
        border-radius: 999px;
        box-shadow: 0 0 24px rgba(255, 230, 0, 0.72);
        height: 10px;
        position: absolute;
        width: 10px;
        z-index: 2;
      }

      .scan-dot.one {
        left: 22%;
        top: 36%;
      }

      .scan-dot.two {
        animation-delay: 0.24s;
        right: 24%;
        top: 62%;
      }

      .scan-dot.three {
        animation-delay: 0.48s;
        bottom: 24%;
        left: 46%;
      }

      .scan-panel {
        background: rgba(5, 5, 12, 0.58);
        border: 1px solid rgba(196, 196, 208, 0.16);
        border-radius: 22px;
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .scan-step {
        align-items: center;
        color: var(--muted);
        display: grid;
        font-size: 0.91rem;
        font-weight: 850;
        gap: 12px;
        grid-template-columns: 13px 1fr;
        line-height: 1.35;
      }

      .scan-step::before {
        background: rgba(196, 196, 208, 0.28);
        border-radius: 999px;
        content: "";
        height: 10px;
        width: 10px;
      }

      .scan-step.active::before {
        animation: pulseDot 1.25s ease-in-out infinite;
        background: var(--yellow);
        box-shadow: 0 0 16px rgba(255, 230, 0, 0.72);
      }

      .scan-step.complete {
        color: white;
      }

      .scan-step.complete::before {
        background: #ffe600;
        box-shadow: 0 0 12px rgba(255, 230, 0, 0.42);
      }

      .scan-log {
        border-top: 1px solid rgba(196, 196, 208, 0.14);
        color: #aaa6b8;
        display: grid;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 0.76rem;
        gap: 8px;
        line-height: 1.45;
        margin-top: 6px;
        padding-top: 14px;
      }

      .scan-log div {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .modal .progress-wrap {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
        height: 14px;
      }

      .modal .progress {
        background: linear-gradient(90deg, var(--yellow) 0%, var(--orange) 38%, var(--pink) 74%, var(--purple) 100%);
        box-shadow: 0 0 22px rgba(255, 50, 255, 0.3);
      }

      .log {
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        color: #d8d3e4;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 0.78rem;
        line-height: 1.55;
        margin-top: 20px;
        max-height: 240px;
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
      }

      .artifact-summary {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        color: var(--muted);
        display: grid;
        gap: 9px;
        margin-top: 20px;
        padding: 15px;
      }

      .artifact-summary strong {
        color: white;
      }

      .artifact-path {
        background: rgba(0, 0, 0, 0.28);
        border-radius: 10px;
        color: white;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 0.84rem;
        line-height: 1.5;
        padding: 12px;
        word-break: break-word;
      }

      .success-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      @keyframes scanSweep {
        0% {
          opacity: 0;
          transform: translateY(0);
        }
        16% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(390%);
        }
      }

      @keyframes scanLineMove {
        0%,
        100% {
          opacity: 0.56;
          transform: translateY(48px);
        }
        50% {
          opacity: 1;
          transform: translateY(calc(min(56.25vw, 100vh) - 120px));
        }
      }

      @keyframes pulseDot {
        0%,
        100% {
          opacity: 0.42;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      @keyframes analyzeSweep {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(340%);
        }
      }

      @keyframes realPageScroll {
        0%,
        12% {
          object-position: top center;
        }
        48%,
        64% {
          object-position: bottom center;
        }
        100% {
          object-position: top center;
        }
      }

      @keyframes heroAurora {
        0% {
          opacity: 0.72;
          transform: translate3d(-2%, 0, 0) scale(1);
        }
        50% {
          opacity: 0.92;
          transform: translate3d(2%, 2%, 0) scale(1.05);
        }
        100% {
          opacity: 0.8;
          transform: translate3d(-1%, -2%, 0) scale(1.02);
        }
      }

      @keyframes heroParticleDrift {
        0% {
          background-position: 0 0, 0 0, 0 0;
        }
        100% {
          background-position: 22px -18px, -28px 24px, 18px 16px;
        }
      }

      @keyframes signalBreath {
        0% {
          opacity: 0.42;
          transform: scaleX(0.94) translateY(8px);
        }
        100% {
          opacity: 0.78;
          transform: scaleX(1.04) translateY(-4px);
        }
      }

      @keyframes signalDash {
        0% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -104;
        }
      }

      @keyframes signalNodePulse {
        0%,
        100% {
          opacity: 0.58;
          transform: translate(-50%, -50%) scale(0.78);
        }
        45% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      @keyframes signalSweep {
        0% {
          opacity: 0;
          transform: translateX(0) rotate(-8deg);
        }
        18%,
        48% {
          opacity: 0.78;
        }
        100% {
          opacity: 0;
          transform: translateX(560%) rotate(-8deg);
        }
      }

      @keyframes stageGlowShift {
        0% {
          opacity: 0.48;
          transform: translateY(0) scale(0.98);
        }
        100% {
          opacity: 0.82;
          transform: translateY(8px) scale(1.04);
        }
      }

      @keyframes motifFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        30% {
          transform: translate3d(-2px, -7px, 0) rotate(-0.65deg);
        }
        65% {
          transform: translate3d(2px, 5px, 0) rotate(0.5deg);
        }
      }

      @keyframes motifStrokePulse {
        0%,
        100% {
          opacity: 0.58;
        }
        35% {
          opacity: 0.82;
        }
        65% {
          opacity: 0.98;
        }
      }

      @keyframes motifHalo {
        0% {
          opacity: 0.42;
          transform: translate(-50%, -50%) scale(0.96);
        }
        100% {
          opacity: 0.72;
          transform: translate(-50%, -50%) scale(1.04);
        }
      }

      @keyframes orbitBreath {
        0% {
          opacity: 0.5;
          transform: translate3d(0, 0, 0) scale(0.98);
        }
        100% {
          opacity: 0.82;
          transform: translate3d(-6px, 6px, 0) scale(1.03);
        }
      }

      @keyframes starDrift {
        0% {
          opacity: 0.28;
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        100% {
          opacity: 0.56;
          transform: translate3d(10px, -8px, 0) rotate(18deg);
        }
      }

      .sr-only {
        clip: rect(0 0 0 0);
        border: 0;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      @media (max-width: 1040px) {
        .hero,
        .launch-section {
          grid-template-columns: 1fr;
        }

        .scan-layout {

      function normalizeApiBaseUrl(value) {
        return String(value || "").trim().replace(/\/+$/, "");
      }

      function readInjectedConfig() {
        const rawConfig = window.__UX_UI_AUDITOR_CONFIG__;
        if (!rawConfig || typeof rawConfig !== "object") return {};
        return rawConfig;
      }

      const BACKEND_OVERRIDE_STORAGE_KEY = "UX_UI_AUDITOR_API_BASE_URL";
      const APP_CONFIG = readInjectedConfig();
      const DEFAULT_API_BASE_URL = normalizeApiBaseUrl(APP_CONFIG.apiBaseUrl || "");

      function getConfiguredApiBaseUrl() {
        const localOverride = window.localStorage.getItem(BACKEND_OVERRIDE_STORAGE_KEY) || "";
        return normalizeApiBaseUrl(localOverride || DEFAULT_API_BASE_URL);
      }

      function persistApiBaseUrlOverride(value) {
        const normalized = normalizeApiBaseUrl(value);
        if (normalized) {
          window.localStorage.setItem(BACKEND_OVERRIDE_STORAGE_KEY, normalized);
        } else {
          window.localStorage.removeItem(BACKEND_OVERRIDE_STORAGE_KEY);
        }
        return getConfiguredApiBaseUrl();
      }

      function clearApiBaseUrlOverride() {
        window.localStorage.removeItem(BACKEND_OVERRIDE_STORAGE_KEY);
        return getConfiguredApiBaseUrl();
      }

      function isCrossOriginApi(apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        if (!resolvedApiBaseUrl) return false;
        try {
          return new URL(resolvedApiBaseUrl).origin !== window.location.origin;
        } catch (_error) {
          return false;
        }
      }

      function buildApiHeaders(extraHeaders, apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        const headers = new Headers(extraHeaders || {});
        if (isCrossOriginApi(resolvedApiBaseUrl) && resolvedApiBaseUrl.includes("ngrok")) {
          headers.set("ngrok-skip-browser-warning", "true");
        }
        return headers;
      }

      function buildApiUrl(path, apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        if (!resolvedApiBaseUrl) return path;
        if (!path.startsWith("/")) return `${resolvedApiBaseUrl}/${path}`;
        return `${resolvedApiBaseUrl}${path}`;
      }

      async function apiFetch(path, options, apiBaseUrl) {
        const resolvedApiBaseUrl = normalizeApiBaseUrl(apiBaseUrl === undefined ? getConfiguredApiBaseUrl() : apiBaseUrl);
        const requestOptions = { ...(options || {}) };
        requestOptions.headers = buildApiHeaders(requestOptions.headers, resolvedApiBaseUrl);
        const targetUrl = buildApiUrl(path, resolvedApiBaseUrl);
        try {
          return await fetch(targetUrl, requestOptions);
        } catch (_error) {
          const base = resolvedApiBaseUrl || window.location.origin;
          throw new Error(`Unable to reach backend API at ${base}. Confirm the Python server is running and update the Backend API URL in this form.`);
        }
      }

      async function readApiJson(response, fallbackMessage) {
        const contentType = response.headers.get("content-type") || "";
        const text = await response.text();
        const cleanText = text.trim();
        const looksLikeJson = cleanText.startsWith("{") || cleanText.startsWith("[");

        if (cleanText && (contentType.includes("application/json") || looksLikeJson)) {
          try {
            return JSON.parse(cleanText);
          } catch (_error) {
            throw new Error(`Backend returned malformed JSON from ${response.url || "the API"}.`);
          }
        }

        if (!cleanText && response.ok) {
          return {};
        }

        const preview = cleanText ? ` Preview: ${cleanText.slice(0, 120)}` : "";
        throw new Error(`${fallbackMessage || "Backend returned a non-JSON response."} Confirm the Backend API URL points to the active backend or ngrok URL.${preview}`);
      }

      function App() {
        const [theme, setTheme] = useState(readStoredTheme);

        const isWebsiteUrlAudit = experienceType === "website" && websiteInputType === "url";

        useEffect(() => {
          function updateTopbarFade() {
            const target = auditSectionRef.current;
            if (!target) {
              setTopbarFade(0);
              setTransitionProgress(0);
              setProcessProgress(0);
              return;
            }

            const scrollY = window.scrollY || window.pageYOffset || 0;
            const auditTop = target.getBoundingClientRect().top + scrollY;
            const fadeStart = Math.max(0, auditTop - window.innerHeight * 1.15);
            const fadeEnd = Math.max(fadeStart + 1, auditTop - window.innerHeight * 0.15);
            const fade = (scrollY - fadeStart) / (fadeEnd - fadeStart);
            const transitionStart = Math.max(0, auditTop - window.innerHeight * 1.55);
            const transitionEnd = Math.max(transitionStart + 1, auditTop - window.innerHeight * 0.24);
            const progress = (scrollY - transitionStart) / (transitionEnd - transitionStart);
            const clampedProgress = Math.min(1, Math.max(0, progress));
            const processStart = Math.max(0, auditTop - window.innerHeight * 0.78);
            const processEnd = Math.max(processStart + 1, auditTop + Math.min(target.offsetHeight * 0.6, window.innerHeight * 1.05));
            const process = (scrollY - processStart) / (processEnd - processStart);
            const clampedProcessProgress = Math.min(1, Math.max(0, process));
            setTopbarFade(Math.min(1, Math.max(0, fade)));
            setTransitionProgress(clampedProgress);
            setProcessProgress(clampedProcessProgress);
          }

          let animationFrameId = 0;

          function handleScroll() {
            if (animationFrameId) return;
            animationFrameId = window.requestAnimationFrame(() => {
              animationFrameId = 0;
              updateTopbarFade();
            });
          }

          updateTopbarFade();
          window.addEventListener("scroll", handleScroll, { passive: true });
          window.addEventListener("resize", handleScroll);

          return () => {
            window.removeEventListener("scroll", handleScroll);
            window.removeEventListener("resize", handleScroll);
            if (animationFrameId) window.cancelAnimationFrame(animationFrameId);
          };
        }, []);

            try {

              const payload = await readApiJson(response, "Unable to refresh the audit status.");
              if (!cancelled && response.ok) {
                setJob(payload);
              }
            } catch (pollError) {
              if (!cancelled) setError("Unable to refresh the audit status.");
            }
          };
          const timer = window.setInterval(poll, 2000);
          poll();
          return () => {

          setIsCriteriaBusy(true);
          setCriteriaStatus("Loading criteria...");
          try {
            const response = await apiFetch("/api/criteria");
            const payload = await readApiJson(response, "Unable to load audit criteria.");
            if (!response.ok) throw new Error(payload.error || "Unable to load audit criteria.");
            const cloned = cloneCriteriaPayload(payload);
            setCriteriaPayload(cloned);
            setCriteriaDraft(cloneCriteriaPayload(cloned));
            setCriteriaStatus(payload.source === "custom" ? "Custom criteria loaded." : "Default criteria loaded.");
          } catch (criteriaError) {
            setCriteriaStatus(criteriaError.message || "Unable to load audit criteria.");
          } finally {
            setIsCriteriaBusy(false);
          }
        }

        async function saveCriteria(draft) {
          setIsCriteriaBusy(true);
          setCriteriaStatus("Saving criteria...");
          try {
            const response = await apiFetch("/api/criteria", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(draft),
            });
            const payload = await readApiJson(response, "Unable to save audit criteria.");
            if (!response.ok) throw new Error(payload.error || "Unable to save audit criteria.");
            const cloned = cloneCriteriaPayload(payload);
            setCriteriaPayload(cloned);
            setCriteriaDraft(cloneCriteriaPayload(cloned));
            setCriteriaStatus("Criteria saved. New audits will use these definitions.");
          } catch (criteriaError) {
            setCriteriaStatus(criteriaError.message || "Unable to save audit criteria.");
          } finally {
            setIsCriteriaBusy(false);
          }
        }

        async function resetCriteria() {
          setIsCriteriaBusy(true);
          setCriteriaStatus("Restoring default criteria...");
          try {
            const response = await apiFetch("/api/criteria/reset", { method: "POST" });
            const payload = await readApiJson(response, "Unable to reset audit criteria.");
            if (!response.ok) throw new Error(payload.error || "Unable to reset audit criteria.");
            const cloned = cloneCriteriaPayload(payload);
            setCriteriaPayload(cloned);
            setCriteriaDraft(cloneCriteriaPayload(cloned));
            setCriteriaStatus("Default criteria restored.");
          } catch (criteriaError) {
            setCriteriaStatus(criteriaError.message || "Unable to reset audit criteria.");
          } finally {
            setIsCriteriaBusy(false);
          }
        }

        function setImageFiles(fileList) {
          const incoming = Array.from(fileList || []).filter((file) => file.type.startsWith("image/"));
          if (!incoming.length) return;
          setScreenshotFilesState((current) => {
            const existing = new Set(current.map((item) => `${item.file.name}-${item.file.size}-${item.file.lastModified}`));
            const additions = incoming
              .filter((file) => !existing.has(`${file.name}-${file.size}-${file.lastModified}`))
              .map((file, index) => ({
                id: screenshotRecordId(file, current.length + index),
                file,
                label: defaultScreenshotLabel(file, current.length + index),
                previewUrl: window.URL.createObjectURL(file),
              }));
            return current.concat(additions);
          });
        }

        function removeScreenshotFile(id) {
          setScreenshotFilesState((current) => {
            const match = current.find((item) => item.id === id);
            if (match) window.URL.revokeObjectURL(match.previewUrl);
            return current.filter((item) => item.id !== id);
          });
        }

        function updateScreenshotLabel(id, label) {
          setScreenshotFilesState((current) => current.map((item) => (item.id === id ? { ...item, label } : item)));
        }

        function applyDiscoveredMobileTarget(target, force) {
          if (!target) return;
          setMobileAppPackage((current) => (force || !current.trim() ? target.appPackage || current : current));
          setMobileAppActivity((current) => (force || !current.trim() ? target.appActivity || current : current));
          setMobileAppLabel((current) => {
            const clean = (current || "").trim();
            if (!force && clean && clean !== "Android App Audit") return current;
            return target.appLabel || clean || "Android App Audit";
          });
        }

        function applyMobileDiscovery(payload, forceTarget) {
          setMobileDiscovery(payload);
          const defaults = payload?.defaults || {};
          setMobileAppiumUrl((current) => current.trim() ? current : defaults.appiumUrl || "http://127.0.0.1:4723");
          setMobileDeviceName((current) => current.trim() && current !== "Android Emulator" ? current : defaults.deviceName || current || "Android Emulator");
          setMobilePlatformVersion((current) => current.trim() ? current : defaults.platformVersion || "");
          setMobileUdid((current) => current.trim() ? current : defaults.udid || "");

          const apps = Array.isArray(payload?.launchableApps) ? payload.launchableApps : [];
          const target = payload?.currentApp || apps[0] || null;
          applyDiscoveredMobileTarget(target, forceTarget);
        }

        async function discoverMobileTarget(forceTarget = false) {
          setIsDiscoveringMobile(true);
          try {
            const response = await apiFetch("/api/mobile/discovery");
            const payload = await readApiJson(response, "Unable to detect the connected Android app.");
            if (!response.ok) {
              throw new Error(payload.error || "Unable to detect the connected Android app.");
            }
            applyMobileDiscovery(payload, forceTarget);
            return payload;
          } catch (discoveryError) {
            setError(discoveryError.message || "Unable to detect the connected Android app.");
            return null;
          } finally {
            setIsDiscoveringMobile(false);
          }
        }

        function selectDiscoveredApp(indexValue) {
          const apps = Array.isArray(mobileDiscovery?.launchableApps) ? mobileDiscovery.launchableApps : [];
          const target = apps[Number(indexValue)];
          applyDiscoveredMobileTarget(target, true);
        }

        function handleUploadDrop(event) {

          setImageFiles(event.dataTransfer.files);

        async function handleSubmit(event) {
          event.preventDefault();
          if (!canStart) return;
          setError("");
          setIsSubmitting(true);
          try {

              const formData = new FormData();

      function CriteriaModal({ criteriaDraft, criteriaStatus, isBusy, onClose, onReload, onReset, onSave, setCriteriaDraft }) {
        const axes = Array.isArray(criteriaDraft?.axes) ? criteriaDraft.axes : [];
        const [selectedAxisId, setSelectedAxisId] = useState("");
        const selectedAxis = axes.find((axis) => axis.id === selectedAxisId) || axes[0] || null;

        useEffect(() => {
          if (!selectedAxisId && axes[0]?.id) setSelectedAxisId(axes[0].id);
          if (selectedAxisId && axes.length && !axes.some((axis) => axis.id === selectedAxisId)) setSelectedAxisId(axes[0].id);
        }, [axes.length, selectedAxisId]);

        function updateAxis(field, value) {
          if (!selectedAxis) return;
          setCriteriaDraft((current) => {
            const next = cloneCriteriaPayload(current);
            next.axes = (next.axes || []).map((axis) => (axis.id === selectedAxis.id ? { ...axis, [field]: value } : axis));
            return next;
          });
        }

        function updateSeverity(level, value) {
          if (!selectedAxis) return;
          setCriteriaDraft((current) => {
            const next = cloneCriteriaPayload(current);
            next.axes = (next.axes || []).map((axis) => {
              if (axis.id !== selectedAxis.id) return axis;
              return { ...axis, severity_ladder: { ...(axis.severity_ladder || {}), [level]: value } };
            });
            return next;
          });
        }

        function uniqueAxisId(existingAxes) {
          const used = new Set((existingAxes || []).map((axis) => axis.id));
          let index = (existingAxes || []).length + 1;
          let id = `custom_axis_${index}`;
          while (used.has(id)) {
            index += 1;
            id = `custom_axis_${index}`;
          }
          return id;
        }

        function addAxis() {
          const id = uniqueAxisId(axes);
          const nextAxis = {
            id,
            name: "New audit axis",

            description: "Describe what this UX/UI axis evaluates.",
            focus: [],
            core_question: "What should the audit decide for this axis?",

      function ProcessConnector({ index, total, progress }) {
        const segmentLength = total > 1 ? 1 / (total - 1) : 1;
        const start = index * segmentLength;
        const segmentProgress = Math.max(0, Math.min(1, (progress - start) / segmentLength));
        return e(
          "div",
          { className: "process-connector", "aria-hidden": "true" },
          e("div", { className: "process-connector-track" }, e("div", { className: "process-connector-fill", style: { "--segment-progress": String(segmentProgress) } }))
        );
      }

      function ProcessStep({ icon, title, text, index, total, progress }) {
        const stepLength = total > 1 ? 1 / (total - 1) : 1;
        const threshold = index * stepLength;
        const isActive = progress >= threshold;
        const localIntensity = Math.max(0, Math.min(1, (progress - threshold + stepLength * 0.6) / (stepLength * 0.9 || 1)));
        return e(
          "div",
          { className: `process-item tone-${(index % 3) + 1}` },
          e(
            "div",
            { className: `process-step${isActive ? " is-active" : ""}`, style: { "--node-intensity": String(localIntensity) } },
            e(
              "div",
              { className: "process-step-node-wrap" },
              e("span", { className: "process-step-node-halo" }),
              e("div", { className: "process-step-node" }, e(Icon, { name: icon || "spark" }))
            ),
            e("strong", null, title),
            text && e("p", null, text)
          )
        );
      }

              { className: "field" },
              e("label", { htmlFor: "mobile-udid" }, "UDID"),
              e("input", { id: "mobile-udid", value: props.mobileUdid, placeholder: "Optional emulator/device id", onChange: (event) => props.setMobileUdid(event.target.value), autoComplete: "off" })
            )
          )
        );
      }

      function jobDescriptor(job) {
        if (!job) return "audit";
        const type = String(job.type || "").toLowerCase();
        const inputType = String(job.inputType || "").toLowerCase();
        if (type === "figma") return "figma design";
        if (type === "mobile" && inputType === "screenshot") return "mobile screenshots";
        if (type === "mobile") return "mobile app";
        if (type === "website" && inputType === "screenshot") return "website screenshots";
        if (type === "website" && inputType === "url") return "website url";
        return type || "audit";
      }

      function scanTargetName(job) {
        if (!job) return "Target website";
        if (job.url) {
          try {
            const parsed = new URL(job.url);
            return job.type === "figma" ? "Figma design" : parsed.hostname.replace(/^www\./, "");
          } catch (_error) {
            return job.url;
          }
        }
        return job.siteName || job.appLabel || "Audit target";
      }

      function currentCrawlTab(job) {
        if (job?.type === "figma") {
          return {
            url: "",
            title: job?.stage || "Preparing Figma audit",
          };
        }
        const fallbackUrl = job?.url || "";
        const fallbackTitle = job?.stage || "Preparing browser tab";
        const logs = Array.isArray(job?.logs) ? [...job.logs].reverse() : [];
        const urlPattern = /(https?:\/\/[^\s]+)/i;

        for (const rawLine of logs) {
          const line = String(rawLine || "");
          const urlMatch = line.match(urlPattern);
          if (!urlMatch) continue;
          const url = urlMatch[1].replace(/[.,)]$/, "");
          const startMatch = line.match(/\]\s*([^>\n]+?)\s*->\s*https?:\/\//);
          return {
            url,
            title: startMatch ? startMatch[1].trim() : "Opening crawled page",
          };
        }

        return {
          url: fallbackUrl,
          title: fallbackUrl ? "Opening website tab" : fallbackTitle,
        };
      }

      function artifactUrlFromPath(rawPath) {
        const value = String(rawPath || "").trim().replace(/\\/g, "/");
        if (!value) return "";
        const markers = ["shared/output/", "shared/generated/"];
        for (const marker of markers) {
          const index = value.indexOf(marker);
          if (index !== -1) {
            return buildApiUrl(`/artifacts/${encodeURI(value.slice(index))}`);
          }
        }
        return "";
      }

      function reportUrlFromJob(job) {
        const value = String(job?.localResultUrl || job?.resultUrl || "").trim();
        if (!value) return "";
        const fallbackLocalPath = job?.id ? `/audits/${encodeURIComponent(job.id)}/` : "";
        if (/^https?:\/\/[^/]*(?:vercel\.app|vercel\.com)\//i.test(value) && fallbackLocalPath) {
          return buildApiUrl(fallbackLocalPath);
        }
        return value.startsWith("/") ? buildApiUrl(value) : value;
      }

      function latestPreviewImageUrl(job) {
        const fromJob = artifactUrlFromPath(job?.previewImagePath);
        if (fromJob) return fromJob;

        const logs = Array.isArray(job?.logs) ? [...job.logs].reverse() : [];
        for (const rawLine of logs) {
          const line = String(rawLine || "");
          const match = line.match(/screenshot saved:\s*(.+)$/i);
          if (!match) continue;
          const fromLog = artifactUrlFromPath(match[1]);
          if (fromLog) return fromLog;
        }

        const screenshotPaths = Array.isArray(job?.screenshotPaths) ? job.screenshotPaths : [];
        if (screenshotPaths.length) return artifactUrlFromPath(screenshotPaths[0]);
        return "";
      }

      function liveFrameUrl(job, currentTab) {
        if (job?.type === "figma") return "";
        const candidate = currentTab?.url || job?.url || "";
        if (!candidate) return "";
        try {
          const parsed = new URL(candidate);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch (_error) {
          return "";
        }
      }

      function crawlTrailFromLogs(job) {
        const logs = Array.isArray(job?.logs) ? job.logs : [];
        const pages = [];
        const seen = new Set();
        for (const rawLine of logs) {
          const line = String(rawLine || "");
          const match = line.match(/\[START\s+(\d+)\/(\d+)\]\s*([^>\n]+?)\s*->\s*(https?:\/\/[^\s]+)/);
          if (!match) continue;
          const url = match[4].replace(/[.,)]$/, "");
          if (seen.has(url)) continue;
          seen.add(url);
          pages.push({
            index: Number(match[1]),
            total: Number(match[2]),
            title: match[3].trim(),
            url,
          });
        }
        if (!pages.length && job?.url) {
          pages.push({ index: 1, total: 1, title: "Home", url: job.url });
        }
        return pages.slice(-4);
      }

      function scanStepsForJob(job, progress, status) {
        const isScreenshot = job?.inputType === "screenshot";
        const isMobile = job?.type === "mobile" && !isScreenshot;
        const isFigma = job?.type === "figma";
        const labels = isMobile
          ? ["Connecting to device", "Exploring app", "Extracting evidence", "Analyzing mobile UX", "Preparing local report"]
          : isFigma
            ? ["Fetching Figma file", "Detecting UX/UI issues", "Capturing evidence", "Building editable report", "Preparing local report"]
            : isScreenshot
            ? ["Loading screenshots", "Reading visual hierarchy", "Checking trust signals", "Writing report", "Preparing local report"]
            : ["Crawling website", "Opening pages", "Extracting UI evidence", "Building audit report", "Preparing local report"];
        const activeIndex = status === "completed" ? labels.length - 1 : Math.min(labels.length - 1, Math.floor((progress || 0) / 22));
        return labels.map((label, index) => ({ label, active: index === activeIndex, complete: index < activeIndex || status === "completed" }));
      }

      function visibleScanLogs(job, status) {
        if (status === "completed") return [];
        return (Array.isArray(job?.logs) ? job.logs : [])
          .filter((line) => {
            const text = String(line || "");
            return !/SyntaxError|internal\/modules|Traceback|RuntimeError|File "\/app/.test(text);
          })
          .slice(-4)
          .filter(Boolean);
      }

      function ScanVisualizer({ job, progress, status }) {
        const target = scanTargetName(job);
        const isFigma = job?.type === "figma";
        const currentTab = currentCrawlTab(job);
        const previewImageUrl = latestPreviewImageUrl(job);
        const frameUrl = liveFrameUrl(job, currentTab);
        const crawlTrail = crawlTrailFromLogs(job);
        const steps = scanStepsForJob(job, progress, status);
        return e(
          "div",
          { className: "scan-layout", "aria-label": "Audit scanning activity" },
          e(
            "div",
            { className: `scan-frame ${frameUrl ? "has-live" : ""} ${previewImageUrl ? "has-preview" : ""}` },
            e("span", { className: "scan-corner tl" }),
            e("span", { className: "scan-corner tr" }),
            e("span", { className: "scan-corner bl" }),
            e("span", { className: "scan-corner br" }),
            e("span", { className: "scan-dot one" }),
            e("span", { className: "scan-dot two" }),
            e("span", { className: "scan-dot three" }),
            previewImageUrl
              ? e("img", { className: "scan-real-shot", src: previewImageUrl, alt: `Captured page preview for ${target}` })
              : e("div", { className: "scan-empty-state" }, e("strong", null, isFigma ? "Waiting for Figma evidence" : "Waiting for first captured page"), e("span", null, isFigma ? "The report will include Figma screenshots when available." : "The real website screenshot will appear here as soon as Playwright saves it.")),
            frameUrl && e("iframe", { className: "scan-live-frame", src: frameUrl, title: `Live website preview for ${target}`, sandbox: "allow-scripts allow-same-origin allow-forms allow-popups" }),
            e("span", { className: "sr-only" }, previewImageUrl ? `Analyzing captured page for ${target}` : `Opening live website preview for ${target}`)
          ),
            e(
              "div",
              { className: "scan-panel" },
            steps.map((step) => e("div", { className: `scan-step ${step.active ? "active" : ""} ${step.complete ? "complete" : ""}`, key: step.label }, step.label))
          )
        );
      }

      function StatusStrip({ job, isStopping, onOpen, onStop }) {
        const progress = job?.progress || 0;
        const canStop = ["queued", "running"].includes(job?.status);
        return e(
          "div",
          { className: "status-strip" },
          e("div", null, e("strong", null, `${jobDescriptor(job)}: ${job.status || "queued"}`), e("div", null, job.stage || "Preparing process")),
          e("div", { className: "progress-wrap", "aria-label": `Progress ${progress}%` }, e("div", { className: "progress", style: { width: `${progress}%` } })),
          e(
            "div",
            { className: "success-actions", style: { marginTop: 0 } },
            canStop && e("button", { className: "ghost stop-button", type: "button", onClick: onStop, disabled: isStopping }, isStopping ? "Stopping..." : "Stop"),
            e("button", { className: "ghost", type: "button", onClick: onOpen }, "Details")
          )
        );
      }

      function ProgressModal({ job, error, isStopping, onClose, onStop }) {
        const progress = job?.progress || 0;
        const status = job?.status || (error ? "failed" : "queued");
        const reportUrl = reportUrlFromJob(job);
        const isMobileLiveJob = job?.type === "mobile" && job?.inputType !== "screenshot";
        const isFigmaJob = job?.type === "figma";
        const isLocalReport = Boolean(
          job?.stage === "Ready for local review" ||
            (job?.resultUrl &&
              (String(job.resultUrl).startsWith("/artifacts/") || String(job.resultUrl).startsWith("/audits/")))
        );
        const isActiveJob = ["queued", "running"].includes(status);
        const completedEyebrow = isLocalReport ? "Local report ready" : "Audit ready";
        const completedHeading = isLocalReport ? "Your editable report is ready locally." : "Your report is ready.";
        const completedMessage = isLocalReport
          ? job?.error || job?.stage || "Review the report locally, apply any text, score, or screenshot changes, then deploy it from the button at the bottom of the report."
          : isFigmaJob
            ? job?.error || job?.stage || "The Figma audit and editable report generation are complete."
            : isMobileLiveJob
              ? job?.error || job?.stage || "The live mobile extraction, analysis, and report generation are complete."
              : job?.stage || "Audit completed.";
        const eyebrow = status === "completed" ? completedEyebrow : status === "cancelled" ? "Stopped" : status === "failed" ? "Action needed" : "Audit running";
        const heading =
          status === "completed"
            ? completedHeading
            : status === "cancelled"
              ? "The audit was stopped."
              : status === "failed"
                ? "The audit could not finish."
                : isFigmaJob
                  ? "Building the Figma audit report."
                : isMobileLiveJob
                  ? "Running the Android extraction."
                  : "Building the audit report.";
        const message = status === "completed" ? completedMessage : status === "cancelled" ? "Audit stopped by user." : error || job?.error || job?.stage || "Preparing process...";

        return e(
          "div",
          { className: "modal-backdrop" },
          e(
            "section",
            { className: "modal", role: "dialog", "aria-modal": "true", "aria-label": "Audit progress" },
            e(
              "div",
              { className: "modal-head" },
              e("div", { className: "ey-pill" }, eyebrow),
              e("button", { className: "ghost", type: "button", onClick: onClose, "aria-label": "Close audit progress" }, e(Icon, { name: "close" }))
            ),
            e("h2", null, heading),
            e("p", { className: "stage" }, message),
            e(ScanVisualizer, { job, progress, status }),
            e("div", { className: "progress-wrap", "aria-label": `Progress ${progress}%` }, e("div", { className: "progress", style: { width: `${progress}%` } })),
            isActiveJob &&
              e(
                "div",
                { className: "success-actions" },
                e("button", { className: "ghost stop-button", type: "button", onClick: onStop, disabled: isStopping }, isStopping ? "Stopping audit..." : "Stop audit"),
                e("button", { className: "ghost", type: "button", onClick: onClose }, "Hide")
              ),
            status === "completed" &&
              e(
                "div",
                { className: "success-actions" },
                reportUrl && e("a", { className: "primary", href: reportUrl, target: "_blank", rel: "noreferrer" }, "Open Local Editable Report", e(Icon, { name: "arrow" })),
                e("button", { className: "ghost", type: "button", onClick: onClose }, "Close")
              ),
            status === "completed" &&
              isMobileLiveJob &&
              job?.outputDir &&
              e("div", { className: "artifact-summary" }, e("strong", null, "Saved artifact directory"), e("div", { className: "artifact-path" }, job.outputDir)),
            ["failed", "cancelled"].includes(status) && e("div", { className: "success-actions" }, e("button", { className: "ghost", type: "button", onClick: onClose }, "Close"))
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(e(App));
    </script>
  </body>
</html>
