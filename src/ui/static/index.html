                        value: item.label,
                        placeholder: `Screenshot ${index + 1} label`,
                        onChange: (event) => updateScreenshotLabel(item.id, event.target.value),
                        "aria-label": `Meaningful name for screenshot ${index + 1}`,
                      })
                    )
                  )
                )
              )
          )
        );
      }

      function MobileFields(props) {
        const launchableApps = Array.isArray(props.mobileDiscovery?.launchableApps) ? props.mobileDiscovery.launchableApps : [];
        const discoveryWarnings = Array.isArray(props.mobileDiscovery?.warnings) ? props.mobileDiscovery.warnings : [];
        return e(
          React.Fragment,
          null,
          e(
            "div",
            { className: "mobile-discovery-panel" },
            e(
              "div",
              null,
              e("strong", null, "Connected Android target"),
              e("span", null, props.mobileDiscovery?.selectedDevice?.udid ? `${props.mobileDiscovery.selectedDevice.deviceName || "Android Device"} (${props.mobileDiscovery.selectedDevice.udid})` : "Detect the emulator/device and launchable app automatically.")
            ),
            e("button", { className: "secondary compact", type: "button", onClick: props.onDiscoverMobileTarget, disabled: props.isDiscoveringMobile }, props.isDiscoveringMobile ? "Detecting..." : "Detect app")
          ),
          launchableApps.length > 0 &&
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-detected-app" }, "Detected launchable apps"),
              e(
                "select",
                { id: "mobile-detected-app", onChange: (event) => props.onSelectDiscoveredApp(event.target.value), defaultValue: "" },
                e("option", { value: "", disabled: true }, "Choose detected app"),
                launchableApps.map((app, index) =>
                  e("option", { key: `${app.appPackage}-${app.appActivity}-${index}`, value: String(index) }, `${app.appLabel || app.appPackage} - ${app.appPackage}`)
                )
              )
            ),
          discoveryWarnings.length > 0 &&
            e("div", { className: "field-note warning-note" }, discoveryWarnings.slice(0, 2).join(" ")),
          e(
            "div",
            { className: "field" },
            e("label", { htmlFor: "mobile-app-label" }, "Audit label"),
            e("input", { id: "mobile-app-label", value: props.mobileAppLabel, placeholder: "Android App Audit", onChange: (event) => props.setMobileAppLabel(event.target.value) })
          ),
          e(
            "div",
            { className: "field-grid" },
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-app-package" }, "App package"),
              e("input", { id: "mobile-app-package", value: props.mobileAppPackage, placeholder: "com.example.app", onChange: (event) => props.setMobileAppPackage(event.target.value), autoComplete: "off" })
            ),
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-app-activity" }, "Launch activity"),
              e("input", { id: "mobile-app-activity", value: props.mobileAppActivity, placeholder: "com.example.app.MainActivity", onChange: (event) => props.setMobileAppActivity(event.target.value), autoComplete: "off" })
            )
          ),
          e(
            "div",
            { className: "field-grid" },
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-appium-url" }, "Appium URL"),
              e("input", { id: "mobile-appium-url", value: props.mobileAppiumUrl, placeholder: "http://127.0.0.1:4723", onChange: (event) => props.setMobileAppiumUrl(event.target.value), autoComplete: "off" })
            ),
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-device-name" }, "Device name"),
              e("input", { id: "mobile-device-name", value: props.mobileDeviceName, placeholder: "Android Emulator", onChange: (event) => props.setMobileDeviceName(event.target.value), autoComplete: "off" })
            )
          ),
          e(
            "div",
            { className: "field-grid" },
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-platform-version" }, "Platform version"),
              e("input", { id: "mobile-platform-version", value: props.mobilePlatformVersion, placeholder: "Optional", onChange: (event) => props.setMobilePlatformVersion(event.target.value), autoComplete: "off" })
            ),
            e(
              "div",
              { className: "field" },
              e("label", { htmlFor: "mobile-udid" }, "UDID"),
              e("input", { id: "mobile-udid", value: props.mobileUdid, placeholder: "Optional emulator/device id", onChange: (event) => props.setMobileUdid(event.target.value), autoComplete: "off" })
            )
          )
        );
      }

      function jobDescriptor(job) {
        if (!job) return "audit";
        const type = String(job.type || "").toLowerCase();
        const inputType = String(job.inputType || "").toLowerCase();
        if (type === "mobile" && inputType === "screenshot") return "mobile screenshots";
        if (type === "mobile") return "mobile app";
        if (type === "website" && inputType === "screenshot") return "website screenshots";
        if (type === "website" && inputType === "url") return "website url";
        return type || "audit";
      }

      function scanTargetName(job) {
        if (!job) return "Target website";
        if (job.url) {
          try {
            return new URL(job.url).hostname.replace(/^www\./, "");
          } catch (_error) {
            return job.url;
          }
        }
        return job.siteName || job.appLabel || "Audit target";
      }

      function currentCrawlTab(job) {
        const fallbackUrl = job?.url || "";
        const fallbackTitle = job?.stage || "Preparing browser tab";
        const logs = Array.isArray(job?.logs) ? [...job.logs].reverse() : [];
        const urlPattern = /(https?:\/\/[^\s]+)/i;

        for (const rawLine of logs) {
          const line = String(rawLine || "");
          const urlMatch = line.match(urlPattern);
          if (!urlMatch) continue;
          const url = urlMatch[1].replace(/[.,)]$/, "");
          const startMatch = line.match(/\]\s*([^>\n]+?)\s*->\s*https?:\/\//);
          return {
            url,
            title: startMatch ? startMatch[1].trim() : "Opening crawled page",
          };
        }

        return {
          url: fallbackUrl,
          title: fallbackUrl ? "Opening website tab" : fallbackTitle,
        };
      }

      function artifactUrlFromPath(rawPath) {
        const value = String(rawPath || "").trim().replace(/\\/g, "/");
        if (!value) return "";
        const markers = ["shared/output/", "shared/generated/"];
        for (const marker of markers) {
          const index = value.indexOf(marker);
          if (index !== -1) {
            return buildApiUrl(`/artifacts/${encodeURI(value.slice(index))}`);
          }
        }
        return "";
      }

      function latestPreviewImageUrl(job) {
        const fromJob = artifactUrlFromPath(job?.previewImagePath);
        if (fromJob) return fromJob;

        const logs = Array.isArray(job?.logs) ? [...job.logs].reverse() : [];
        for (const rawLine of logs) {
          const line = String(rawLine || "");
          const match = line.match(/screenshot saved:\s*(.+)$/i);
          if (!match) continue;
          const fromLog = artifactUrlFromPath(match[1]);
          if (fromLog) return fromLog;
        }

        const screenshotPaths = Array.isArray(job?.screenshotPaths) ? job.screenshotPaths : [];
        if (screenshotPaths.length) return artifactUrlFromPath(screenshotPaths[0]);
        return "";
      }

      function liveFrameUrl(job, currentTab) {
        const candidate = currentTab?.url || job?.url || "";
        if (!candidate) return "";
        try {
          const parsed = new URL(candidate);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch (_error) {
          return "";
        }
      }

      function crawlTrailFromLogs(job) {
        const logs = Array.isArray(job?.logs) ? job.logs : [];
        const pages = [];
        const seen = new Set();
        for (const rawLine of logs) {
          const line = String(rawLine || "");
          const match = line.match(/\[START\s+(\d+)\/(\d+)\]\s*([^>\n]+?)\s*->\s*(https?:\/\/[^\s]+)/);
          if (!match) continue;
          const url = match[4].replace(/[.,)]$/, "");
          if (seen.has(url)) continue;
          seen.add(url);
          pages.push({
            index: Number(match[1]),
            total: Number(match[2]),
            title: match[3].trim(),
            url,
          });
        }
        if (!pages.length && job?.url) {
          pages.push({ index: 1, total: 1, title: "Home", url: job.url });
        }
        return pages.slice(-4);
      }

      function scanStepsForJob(job, progress, status) {
        const isScreenshot = job?.inputType === "screenshot";
        const isMobile = job?.type === "mobile" && !isScreenshot;
        const labels = isMobile
          ? ["Connecting to device", "Launching app", "Reading hierarchy", "Capturing artifacts", "Preparing output"]
          : isScreenshot
            ? ["Loading screenshots", "Reading visual hierarchy", "Checking trust signals", "Writing report", "Publishing result"]
            : ["Crawling website", "Opening pages", "Extracting UI evidence", "Building audit report", "Publishing result"];
        const activeIndex = status === "completed" ? labels.length - 1 : Math.min(labels.length - 1, Math.floor((progress || 0) / 22));
        return labels.map((label, index) => ({ label, active: index === activeIndex, complete: index < activeIndex || status === "completed" }));
      }

      function visibleScanLogs(job, status) {
        if (status === "completed") return [];
        return (Array.isArray(job?.logs) ? job.logs : [])
          .filter((line) => {
            const text = String(line || "");
            return !/SyntaxError|internal\/modules|Traceback|RuntimeError|File "\/app/.test(text);
          })
          .slice(-4)
          .filter(Boolean);
      }

      function ScanVisualizer({ job, progress, status }) {
        const target = scanTargetName(job);
        const currentTab = currentCrawlTab(job);
        const previewImageUrl = latestPreviewImageUrl(job);
        const frameUrl = liveFrameUrl(job, currentTab);
        const crawlTrail = crawlTrailFromLogs(job);
        const steps = scanStepsForJob(job, progress, status);
        return e(
          "div",
          { className: "scan-layout", "aria-label": "Audit scanning activity" },
          e(
            "div",
            { className: `scan-frame ${frameUrl ? "has-live" : ""} ${previewImageUrl ? "has-preview" : ""}` },
            e("span", { className: "scan-corner tl" }),
            e("span", { className: "scan-corner tr" }),
            e("span", { className: "scan-corner bl" }),
            e("span", { className: "scan-corner br" }),
            e("span", { className: "scan-dot one" }),
            e("span", { className: "scan-dot two" }),
            e("span", { className: "scan-dot three" }),
            previewImageUrl
              ? e("img", { className: "scan-real-shot", src: previewImageUrl, alt: `Captured page preview for ${target}` })
              : e("div", { className: "scan-empty-state" }, e("strong", null, "Waiting for first captured page"), e("span", null, "The real website screenshot will appear here as soon as Playwright saves it.")),
            frameUrl && e("iframe", { className: "scan-live-frame", src: frameUrl, title: `Live website preview for ${target}`, sandbox: "allow-scripts allow-same-origin allow-forms allow-popups" }),
            e("span", { className: "sr-only" }, previewImageUrl ? `Analyzing captured page for ${target}` : `Opening live website preview for ${target}`)
          ),
            e(
              "div",
              { className: "scan-panel" },
            steps.map((step) => e("div", { className: `scan-step ${step.active ? "active" : ""} ${step.complete ? "complete" : ""}`, key: step.label }, step.label))
          )
        );
      }

      function StatusStrip({ job, isStopping, onOpen, onStop }) {
        const progress = job?.progress || 0;
        const canStop = ["queued", "running"].includes(job?.status);
        return e(
          "div",
          { className: "status-strip" },
          e("div", null, e("strong", null, `${jobDescriptor(job)}: ${job.status || "queued"}`), e("div", null, job.stage || "Preparing process")),
          e("div", { className: "progress-wrap", "aria-label": `Progress ${progress}%` }, e("div", { className: "progress", style: { width: `${progress}%` } })),
          e(
            "div",
            { className: "success-actions", style: { marginTop: 0 } },
            canStop && e("button", { className: "ghost stop-button", type: "button", onClick: onStop, disabled: isStopping }, isStopping ? "Stopping..." : "Stop"),
            e("button", { className: "ghost", type: "button", onClick: onOpen }, "Details")
          )
        );
      }

      function ProgressModal({ job, error, isStopping, onClose, onStop }) {
        const progress = job?.progress || 0;
        const status = job?.status || (error ? "failed" : "queued");
        const isMobileLiveJob = job?.type === "mobile" && job?.inputType !== "screenshot";
        const isLocalReport = Boolean(job?.resultUrl && String(job.resultUrl).startsWith("/artifacts/"));
        const isActiveJob = ["queued", "running"].includes(status);
        const completedEyebrow = isMobileLiveJob ? "Artifacts ready" : isLocalReport ? "Local report ready" : "Deployment ready";
        const completedHeading = isMobileLiveJob ? "Mobile extraction is complete." : isLocalReport ? "Your report is ready locally." : "Your report is deployed.";
        const completedMessage = isMobileLiveJob
          ? job?.stage || "The first Android screen, hierarchy, and structured extraction artifacts are ready."
          : isLocalReport
            ? job?.error || job?.stage || "The report was generated and served locally because Vercel deployment did not complete."
            : job?.stage || "Deployment completed.";
        const eyebrow = status === "completed" ? completedEyebrow : status === "cancelled" ? "Stopped" : status === "failed" ? "Action needed" : "Audit running";
        const heading =
          status === "completed"
            ? completedHeading
            : status === "cancelled"
              ? "The audit was stopped."
              : status === "failed"
                ? "The audit could not finish."
                : isMobileLiveJob
                  ? "Running the Android extraction."
                  : "Building the audit report.";
        const message = status === "completed" ? completedMessage : status === "cancelled" ? "Audit stopped by user." : error || job?.error || job?.stage || "Preparing process...";

        return e(
          "div",
          { className: "modal-backdrop" },
          e(
            "section",
            { className: "modal", role: "dialog", "aria-modal": "true", "aria-label": "Audit progress" },
            e(
              "div",
              { className: "modal-head" },
              e("div", { className: "ey-pill" }, eyebrow),
              e("button", { className: "ghost", type: "button", onClick: onClose, "aria-label": "Close audit progress" }, e(Icon, { name: "close" }))
            ),
            e("h2", null, heading),
            e("p", { className: "stage" }, message),
            e(ScanVisualizer, { job, progress, status }),
            e("div", { className: "progress-wrap", "aria-label": `Progress ${progress}%` }, e("div", { className: "progress", style: { width: `${progress}%` } })),
            isActiveJob &&
              e(
                "div",
                { className: "success-actions" },
                e("button", { className: "ghost stop-button", type: "button", onClick: onStop, disabled: isStopping }, isStopping ? "Stopping audit..." : "Stop audit"),
                e("button", { className: "ghost", type: "button", onClick: onClose }, "Hide")
              ),
            status === "completed" &&
              e(
                "div",
                { className: "success-actions" },
                !isMobileLiveJob && job.resultUrl && e("a", { className: "primary", href: job.resultUrl, target: "_blank", rel: "noreferrer" }, "Open Audit Report", e(Icon, { name: "arrow" })),
                e("button", { className: "ghost", type: "button", onClick: onClose }, "Close")
              ),
            status === "completed" &&
              isMobileLiveJob &&
              job?.outputDir &&
              e("div", { className: "artifact-summary" }, e("strong", null, "Saved artifact directory"), e("div", { className: "artifact-path" }, job.outputDir)),
            ["failed", "cancelled"].includes(status) && e("div", { className: "success-actions" }, e("button", { className: "ghost", type: "button", onClick: onClose }, "Close"))
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(e(App));
    </script>
    <script src="https://chaingpt-web.s3.us-east-2.amazonaws.com/assets/js/main-script-no-reviews.js" type="module" async></script>
  </body>
</html>
